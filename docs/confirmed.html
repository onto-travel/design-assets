<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Exotica · Booking confirmed</title>
<style>
  :root{
    --bg:#efeae1; --card:#ffffff; --ink:#1c1c1c; --muted:#7c7771; --line:#e7e1d6;
    --navy:#2f4f74; --navy-deep:#284667; --gold:#c19a4b; --green:#2a7d5f;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 44px rgba(40,30,10,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0;}

  .card{width:520px;max-width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;}
  .head{text-align:center;padding:40px 34px 26px;}
  .check{width:66px;height:66px;border-radius:50%;background:#eaf5ef;border:1px solid #cfe8db;
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .check svg{width:32px;height:32px;stroke:var(--green);stroke-width:2.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  .check.pop{animation:pop .45s cubic-bezier(.22,1.2,.36,1) both;}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
  .head h1{font-size:27px;margin-bottom:8px;}
  .head p{color:var(--muted);font-size:15px;margin:0 auto;max-width:360px;}
  .ref{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:#faf7f1;
    border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-size:13.5px;color:#4a4641;}
  .ref b{color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;}

  .stars{color:var(--gold);letter-spacing:3px;font-size:14px;}
  .sum{margin:4px 34px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .sum-hd{padding:18px 18px 16px;background:#faf7f1;}
  .sum-hd .h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .sum-hd .n{font-family:Georgia,serif;font-size:17px;font-weight:700;margin-top:3px;}
  .sum-hd .hd-dates{font-size:14.5px;font-weight:600;color:#4a4641;margin-top:11px;}
  .sum-hd .hd-dates span{font-weight:400;color:var(--muted);}
  .sum-hd .hd-dates span::before{content:" · ";}
  .sum-hd .loc{color:var(--navy);font-weight:600;font-size:11.5px;letter-spacing:.06em;margin-top:2px;}
  .row{display:flex;gap:14px;padding:12px 18px;}
  .row+.row{border-top:1px solid #f1ede5;}
  .k{flex:0 0 96px;font-size:12.5px;color:var(--muted);padding-top:1px;}
  .v{font-size:14.5px;color:var(--ink);font-weight:600;}
  .v span{font-weight:400;color:var(--muted);}
  .v span::before{content:" · ";}
  .paid{display:flex;align-items:center;justify-content:space-between;margin:18px 34px 0;
    padding:16px 18px;border:1px solid #cfe8db;background:#f2f8f5;border-radius:14px;}
  .paid .pl{font-size:13px;color:#3a6a55;font-weight:600;}
  .paid .pl b{display:block;color:var(--green);font-size:11.5px;letter-spacing:.04em;margin-top:2px;font-weight:700;}
  .paid .amt{font-family:Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em;}
  .cta{display:flex;gap:12px;padding:24px 34px 14px;}
  .btn{flex:1;border:none;background:var(--navy);color:#fff;font-size:15.5px;font-weight:600;
    padding:15px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;
    transition:background .15s;}
  .btn:hover{background:var(--navy-deep);}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #d9d1c1;}
  .btn.ghost:hover{background:#faf7f1;border-color:#c2b8a4;}
  .tertiary{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    background:none;border:none;color:var(--navy);font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;padding:0 34px 30px;}
  .tertiary:hover{text-decoration:underline;}
  .tertiary svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  @media(max-width:480px){ .cta{flex-direction:column;} .k{flex-basis:80px;} }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="check pop" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      </div>
      <h1>Booking confirmed</h1>
      <p id="lede">Your stay is booked.</p>
      <div class="ref">Booking reference&nbsp; <b id="ref">TAJ-000000</b></div>
    </div>

    <div class="sum">
      <div class="sum-hd">
        <div class="h">Your stay</div>
        <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
        <div class="n" id="hotel">Taj Exotica Resort &amp; Spa</div>
        <div class="hd-dates" id="dates">Fri 10 – Mon 13 Jul<span id="nights">3 nights</span></div>
      </div>
    </div>

    <div class="paid">
      <div class="pl">Paid via Razorpay<b>✓ PAYMENT SUCCESSFUL</b></div>
      <div class="amt" id="amount">₹55,500</div>
    </div>

    <div class="cta">
      <a class="btn ghost" href="checkout.html">View booking</a>
      <a class="btn" href="hotel-firstfold.html">Back to home</a>
    </div>
    <button type="button" class="tertiary" id="dlVoucher">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"></path></svg>
      Download the voucher
    </button>
  </div>

<script>
  var b = {};
  try { b = JSON.parse(sessionStorage.getItem('booking')) || {}; } catch(e){}
  function set(id, val){ if(val){ document.getElementById(id).textContent = val; } }
  function setHTML(id, val){ if(val){ document.getElementById(id).innerHTML = val; } }

  set('hotel', b.hotel);
  set('amount', b.amount);
  // dates keeps its "· nights" sub span, so build it as HTML
  if(b.dates){ document.getElementById('dates').innerHTML = b.dates + (b.nights ? '<span>'+b.nights+'</span>' : ''); }

  // booking reference — stable per confirmed booking (kept in sessionStorage)
  var ref = b.ref;
  if(!ref){
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for(var i=0;i<6;i++){ s += chars.charAt(Math.floor(Math.random()*chars.length)); }
    ref = 'TAJ-' + s;
    b.ref = ref;
    try { sessionStorage.setItem('booking', JSON.stringify(b)); } catch(e){}
  }
  document.getElementById('ref').textContent = ref;

  // download a simple text voucher (prototype)
  document.getElementById('dlVoucher').addEventListener('click', function(){
    var lines = [
      'TAJ EXOTICA RESORT & SPA — BOOKING VOUCHER',
      '==========================================',
      '',
      'Booking reference : ' + ref,
      'Hotel             : ' + (b.hotel || 'Taj Exotica Resort & Spa'),
      'Dates             : ' + (b.dates || '') + (b.nights ? ' (' + b.nights + ')' : ''),
      'Room              : ' + (b.room || 'Villa Room'),
      'Guests            : ' + (b.guests || ''),
      'Amount paid       : ' + (b.amount || '') + '  · paid via Razorpay',
      '',
      'Present this voucher at check-in. Prototype — not a real booking.'
    ];
    var blob = new Blob([lines.join('\n')], {type:'text/plain'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Taj-Exotica-voucher-' + ref + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
  });
</script>
</body>
</html>
