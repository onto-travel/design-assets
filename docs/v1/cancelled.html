<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Exotica · Booking cancelled</title>
<style>
  :root{
    --bg:#efeae1; --card:#ffffff; --ink:#1c1c1c; --muted:#7c7771; --line:#e7e1d6;
    --jade:#2f4f74; --jade-deep:#284667; --gold:#c19a4b; --green:#2a7d5f; --danger:#b23b32;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 44px rgba(40,30,10,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0;}

  .card{width:520px;max-width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;}
  .head{text-align:center;padding:40px 34px 24px;}
  .mark{width:66px;height:66px;border-radius:50%;background:#f3efe8;border:1px solid #e3dccf;
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .mark svg{width:30px;height:30px;stroke:var(--muted);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .mark.pop{animation:pop .45s cubic-bezier(.22,1.2,.36,1) both;}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
  .head h1{font-size:27px;margin-bottom:8px;}
  .head p{color:var(--muted);font-size:15px;margin:0 auto;max-width:380px;}
  .ref{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:#faf7f1;
    border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-size:13.5px;color:#4a4641;}
  .ref b{color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;}

  .stars{color:var(--gold);letter-spacing:3px;font-size:14px;}
  .sum{margin:4px 34px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;opacity:.72;}
  .sum-hd{padding:18px 18px 16px;background:#faf7f1;position:relative;}
  .sum-hd .h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .sum-hd .n{font-family:Georgia,serif;font-size:17px;font-weight:700;margin-top:3px;text-decoration:line-through;text-decoration-color:#c9c1b2;}
  .sum-hd .hd-dates{font-size:14.5px;font-weight:600;color:#4a4641;margin-top:11px;}
  .sum-hd .hd-dates span{font-weight:400;color:var(--muted);}
  .sum-hd .hd-dates span::before{content:" · ";}
  .voidtag{position:absolute;right:16px;top:16px;background:#f3e4e2;color:var(--danger);
    font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:20px;}

  .refund{display:flex;align-items:center;justify-content:space-between;margin:18px 34px 0;
    padding:16px 18px;border:1px solid #cfe8db;background:#f2f8f5;border-radius:14px;}
  .refund .pl{font-size:13px;color:#3a6a55;font-weight:600;}
  .refund .pl b{display:block;color:var(--green);font-size:11.5px;letter-spacing:.04em;margin-top:2px;font-weight:700;}
  .refund .amt{font-family:Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em;}

  .cta{display:flex;gap:12px;padding:24px 34px 30px;}
  .btn{flex:1;border:none;background:var(--jade);color:#fff;font-size:15.5px;font-weight:600;
    padding:15px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;
    transition:background .15s;}
  .btn:hover{background:var(--jade-deep);}
  .btn.ghost{background:#fff;color:var(--jade);border:1px solid #d9d1c1;}
  .btn.ghost:hover{background:#faf7f1;border-color:#c2b8a4;}
  @media(max-width:480px){ .cta{flex-direction:column;} }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="mark pop" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      </div>
      <h1>Booking cancelled</h1>
      <p id="lede">Your reservation has been cancelled and a full refund is on its way.</p>
      <div class="ref">Booking reference&nbsp; <b id="ref">TAJ-000000</b></div>
    </div>

    <div class="sum">
      <div class="sum-hd">
        <span class="voidtag">CANCELLED</span>
        <div class="h">Your stay</div>
        <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
        <div class="n" id="hotel">Taj Exotica Resort &amp; Spa</div>
        <div class="hd-dates" id="dates">Fri 10 – Mon 13 Jul<span id="nights">3 nights</span></div>
      </div>
    </div>

    <div class="refund">
      <div class="pl">Refund to Razorpay<b>✓ FULL REFUND · 5–7 BUSINESS DAYS</b></div>
      <div class="amt" id="amount">₹55,500</div>
    </div>

    <div class="cta">
      <a class="btn ghost" href="hotel-firstfold.html">Book again</a>
      <a class="btn" href="home2.html">Back to home</a>
    </div>
  </div>

<script>
  var b = {};
  try { b = JSON.parse(sessionStorage.getItem('booking')) || {}; } catch(e){}
  function set(id, val){ if(val){ document.getElementById(id).textContent = val; } }

  set('hotel', b.hotel);
  set('amount', b.refund || b.amount);
  set('ref', b.ref || 'TAJ-000000');
  if(b.dates){ document.getElementById('dates').innerHTML = b.dates + (b.nights ? '<span>'+b.nights+'</span>' : ''); }

  // safety: ensure the cancelled status is persisted even if arrived here directly
  if(b.ref && b.status !== 'cancelled'){
    b.status = 'cancelled';
    try { sessionStorage.setItem('booking', JSON.stringify(b)); } catch(e){}
  }
</script>
</body>
</html>
