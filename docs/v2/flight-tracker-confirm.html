<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto — Confirm flight</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-default);color:var(--text-primary);
    font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }

  /* ---------- phone frame ---------- */
  .phone{position:relative;width:390px;height:844px;background:#000;border-radius:54px;
    padding:12px;box-shadow:0 40px 90px rgba(30,22,10,.16),0 0 0 2px rgba(0,0,0,.15);flex:none;}
  .screen{position:relative;width:100%;height:100%;background:var(--bg-surface);border-radius:42px;
    overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:30px;
    background:#000;border-radius:20px;z-index:40;}

  .statusbar{position:relative;z-index:35;flex:none;display:flex;align-items:center;
    justify-content:space-between;padding:20px 26px 6px;font-size:14px;font-weight:600;
    color:var(--text-primary);}
  .sb-right{display:flex;align-items:center;gap:6px;font-size:13px;}

  .appbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px;}
  .ab-btn{width:38px;height:38px;border-radius:50%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--icon-primary);
    transition:background .15s;flex:none;}
  .ab-btn:hover{background:var(--green-soft);}
  .ab-btn svg{width:20px;height:20px;stroke:var(--icon-primary);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .at-title{font-family:var(--font-body);font-size:var(--fs-xl);font-weight:var(--fw-bold);color:var(--text-primary);}

  .body{flex:1;overflow-y:auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:var(--sp-20);}

  /* ---------- summary card ---------- */
  .card{border:1px solid var(--border-default);border-radius:var(--r-xl);box-shadow:var(--shadow-l2);
    padding:var(--sp-20);display:flex;flex-direction:column;gap:var(--sp-16);}

  .air-row{display:flex;align-items:center;gap:var(--sp-12);}
  .air-mark{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:var(--fw-bold);flex:none;}
  .air-tx{flex:1;min-width:0;}
  .air-name{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .air-num{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .status-chip{flex:none;background:var(--bg-muted);color:var(--text-body);border-radius:var(--r-round);
    padding:6px 12px;font-size:var(--fs-xs);font-weight:var(--fw-bold);}

  .divider{height:1px;background:var(--border-default);border:none;margin:0;}

  .route-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-8);}
  .rp{display:flex;flex-direction:column;gap:2px;}
  .rp.dest{align-items:flex-end;text-align:right;}
  .rp-time{font-family:var(--font-display);font-size:var(--fs-h4);font-weight:var(--fw-display);color:var(--text-primary);}
  .rp-code{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .rp-city{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .route-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;}
  .route-line{position:relative;width:100%;height:1px;background:var(--border-default);}
  .route-line svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;
    stroke:var(--icon-secondary);fill:var(--bg-surface);stroke-width:1.6;}
  .route-dur{font-size:var(--fs-xs);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .flight-date{text-align:center;font-size:var(--fs-s);color:var(--text-body);font-weight:var(--fw-bold);}

  .meta-row{display:flex;align-items:center;justify-content:space-between;}
  .meta-label{font-size:var(--fs-l);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .meta-value{font-size:var(--fs-l);color:var(--text-primary);font-weight:var(--fw-bold);}

  .ontime{display:flex;align-items:center;gap:var(--sp-8);font-size:var(--fs-s);color:var(--text-secondary);
    font-weight:var(--fw-medium);}
  .ontime svg{width:15px;height:15px;stroke:var(--accent-brand-primary);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}

  .actions{display:flex;flex-direction:column;gap:var(--sp-12);}

  .cta{width:100%;border:none;border-radius:var(--r-lg);background:var(--bg-button);
    color:var(--text-inverse);padding:17px;font-family:inherit;font-size:var(--fs-l);
    font-weight:var(--fw-bold);cursor:pointer;box-shadow:var(--shadow-l2);
    transition:opacity .15s,transform .12s;}
  .cta:hover{opacity:.88;}
  .cta:active{transform:scale(.98);}
  .cta.done{background:var(--green-deep);}

  .sec-link{display:block;text-align:center;font-size:var(--fs-l);font-weight:var(--fw-bold);
    color:var(--text-secondary);text-decoration:none;padding:2px;}
  .sec-link:hover{color:var(--text-primary);}

  .src-badge{display:none;align-items:center;gap:var(--sp-8);align-self:flex-start;
    background:var(--green-soft);color:var(--green-deep);border-radius:var(--r-round);
    padding:6px 12px;font-size:var(--fs-xs);font-weight:var(--fw-bold);}
  .src-badge svg{width:13px;height:13px;stroke:var(--green-deep);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .meta-row.upload-only{display:none;}

  /* ---------- prototype stage nav — review aid, not part of the product UI ---------- */
  .stage-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;gap:6px;background:rgba(17,24,39,.92);backdrop-filter:blur(6px);
    padding:8px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:calc(100vw - 32px);overflow-x:auto;z-index:9999;}
  .stage-nav::-webkit-scrollbar{display:none;}
  .stage-nav a{flex:none;padding:7px 12px;border-radius:999px;font-family:-apple-system,sans-serif;
    font-size:12px;font-weight:600;color:rgba(255,255,255,.6);text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s;}
  .stage-nav a:hover{color:#fff;background:rgba(255,255,255,.08);}
  .stage-nav a.current{background:#fff;color:#111827;}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>

    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">&#9679;&#9679;&#9679; &nbsp;&#128246;&nbsp; &#128267;</span>
    </div>

    <div class="appbar">
      <button class="ab-btn" aria-label="Back" onclick="location.href='flight-tracker.html'">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="at-title">Confirm flight</span>
      <span style="width:38px"></span>
    </div>

    <div class="body">
      <div class="src-badge" id="srcBadge">
        <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        Detected from your boarding pass
      </div>

      <div class="card">
        <div class="air-row">
          <div class="air-mark" id="airMark">AI</div>
          <div class="air-tx">
            <div class="air-name" id="airName">Air India</div>
            <div class="air-num" id="airNum">AI 101</div>
          </div>
          <div class="status-chip">Scheduled</div>
        </div>

        <hr class="divider">

        <div class="route-row">
          <div class="rp">
            <div class="rp-time" id="fromTime">14:30</div>
            <div class="rp-code" id="fromCode">DEL</div>
            <div class="rp-city" id="fromCity">Delhi</div>
          </div>
          <div class="route-mid">
            <div class="route-dur" id="routeDur">2h 15m</div>
            <div class="route-line">
              <svg viewBox="0 0 24 24"><path d="M2 16l20-8-8 20-3-9-9-3z"/></svg>
            </div>
          </div>
          <div class="rp dest">
            <div class="rp-time" id="toTime">16:45</div>
            <div class="rp-code" id="toCode">BOM</div>
            <div class="rp-city" id="toCity">Mumbai</div>
          </div>
        </div>

        <div class="flight-date">Mon, 24 Aug</div>

        <hr class="divider">

        <div class="meta-row">
          <span class="meta-label">Aircraft</span>
          <span class="meta-value" id="aircraftVal">Airbus A320</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Terminal</span>
          <span class="meta-value" id="terminalVal">T3 &middot; Departures</span>
        </div>
        <div class="meta-row upload-only" id="rowSeat">
          <span class="meta-label">Seat</span>
          <span class="meta-value">14A</span>
        </div>
        <div class="meta-row upload-only" id="rowPnr">
          <span class="meta-label">Booking reference</span>
          <span class="meta-value">XKQ9TP</span>
        </div>

        <div class="ontime">
          <svg viewBox="0 0 24 24"><path d="M12 2v6M12 22v-6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6M4.9 19.1l4.2-4.2M14.9 9.1l4.2-4.2"/></svg>
          <span id="ontimeText">On-time 89% of the last 30 days</span>
        </div>
      </div>

      <div class="actions">
        <button class="cta" id="trackBtn" onclick="trackFlight()">Track this flight</button>
        <a class="sec-link" href="flight-tracker.html">Search a different flight</a>
      </div>
    </div>
  </div>
</div>

<script>
/* A handful of known mock flights so searching a different number actually
   changes the route/aircraft/stats, not just the airline name. Anything else
   falls back to the AI101 shape — we don't have a real schedule for it, but
   the identity fields (mark/name/number) still reflect what was typed. */
var MOCK_FLIGHTS = {
  AI101:{airline:'Air India',
    from:{code:'DEL',city:'Delhi',time:'14:30',terminal:'T3 · Departures'},
    to:{code:'BOM',city:'Mumbai',time:'16:45',terminal:'T2 · Arrivals'},
    duration:'2h 15m',distance:'1,150 km',aircraft:'Airbus A320',onTimePct:89},
  '6E234':{airline:'IndiGo',
    from:{code:'DEL',city:'Delhi',time:'19:15',terminal:'T1 · Departures'},
    to:{code:'BOM',city:'Mumbai',time:'21:25',terminal:'T1 · Arrivals'},
    duration:'2h 10m',distance:'1,150 km',aircraft:'Airbus A321neo',onTimePct:82},
  UK955:{airline:'Vistara',
    from:{code:'BLR',city:'Bengaluru',time:'18:05',terminal:'T1 · Departures'},
    to:{code:'DEL',city:'Delhi',time:'20:55',terminal:'T3 · Arrivals'},
    duration:'2h 50m',distance:'1,740 km',aircraft:'Airbus A321',onTimePct:91}
};
var CARRIERS = {AI:'Air India', '6E':'IndiGo', UK:'Vistara', SG:'SpiceJet', G8:'Go First', QP:'Akasa Air'};

var params = new URLSearchParams(location.search);
var compact = (params.get('num') || 'AI101').replace(/\s+/g,'').toUpperCase();
var code = compact.slice(0,2);
var num = compact.slice(2);
var currentFlightNum = num ? (code + ' ' + num) : code;
var flight = MOCK_FLIGHTS[compact] || MOCK_FLIGHTS.AI101;

document.getElementById('airMark').textContent = code;
document.getElementById('airNum').textContent = currentFlightNum;
document.getElementById('airName').textContent = CARRIERS[code] || 'Tracked flight';
document.getElementById('fromTime').textContent = flight.from.time;
document.getElementById('fromCode').textContent = flight.from.code;
document.getElementById('fromCity').textContent = flight.from.city;
document.getElementById('toTime').textContent = flight.to.time;
document.getElementById('toCode').textContent = flight.to.code;
document.getElementById('toCity').textContent = flight.to.city;
document.getElementById('routeDur').textContent = flight.duration;
document.getElementById('aircraftVal').textContent = flight.aircraft;
document.getElementById('terminalVal').textContent = flight.from.terminal;
document.getElementById('ontimeText').textContent = 'On-time ' + flight.onTimePct + '% of the last 30 days';

if(params.get('src') === 'upload'){
  document.getElementById('srcBadge').style.display = 'flex';
  document.getElementById('rowSeat').style.display = 'flex';
  document.getElementById('rowPnr').style.display = 'flex';
}

function trackFlight(){
  var btn = document.getElementById('trackBtn');
  btn.textContent = '✓ Tracking ' + currentFlightNum;
  btn.classList.add('done');
  btn.disabled = true;
  setTimeout(function(){
    location.href = 'flight-tracker-detail.html?num=' + encodeURIComponent(compact);
  }, 500);
}
</script>
<script>
(function(){
  var STAGES = [
    {file:'flight-tracker.html', label:'Add flight'},
    {file:'flight-tracker-confirm.html', label:'Confirm'},
    {file:'flight-tracker-detail.html', label:'Pre-flight'},
    {file:'flight-tracker-airport.html', label:'Boarding pass'},
    {file:'flight-tracker-inflight.html', label:'Boarded', extra:'phase=boarded'},
    {file:'flight-tracker-inflight.html', label:'In the air'},
    {file:'flight-tracker-arrival.html', label:'Landed'}
  ];
  var here = location.pathname.split('/').pop();
  var herePhase = new URLSearchParams(location.search).get('phase') || '';
  var nav = document.createElement('div');
  nav.className = 'stage-nav';
  STAGES.forEach(function(s){
    var params = [];
    if(s.file !== 'flight-tracker.html' && typeof compact !== 'undefined') params.push('num=' + encodeURIComponent(compact));
    if(s.extra) params.push(s.extra);
    var a = document.createElement('a');
    a.href = s.file + (params.length ? '?' + params.join('&') : '');
    a.textContent = s.label;
    var matchesPhase = s.extra ? herePhase === 'boarded' : herePhase !== 'boarded';
    if(s.file === here && matchesPhase) a.classList.add('current');
    nav.appendChild(a);
  });
  document.body.appendChild(nav);
})();
</script>
</body>
</html>
