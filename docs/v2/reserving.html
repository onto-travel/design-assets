<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto · Reserving…</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .brand{font-family:var(--font-display);font-weight:900;font-size:20px;color:var(--jade);letter-spacing:-.01em;margin-bottom:30px;}
  .brand span{color:var(--gold);}
  .spin{width:46px;height:46px;border-radius:50%;border:3px solid #efefef;border-top-color:var(--jade);
    animation:spin .8s linear infinite;margin:0 auto 22px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spin{animation-duration:2s;}}
  h1{font-family:var(--font-display);font-weight:900;font-size:22px;margin:0;letter-spacing:-.01em;}
</style>
</head>
<body>
  <div>
    <div class="brand">onto<span>.</span></div>
    <div class="spin" aria-hidden="true"></div>
    <h1>Reserving your room</h1>
  </div>
<script>
  var dest = 'booking-details.html';
  try { var r = sessionStorage.getItem('payReturn'); if(r){ dest = r; sessionStorage.removeItem('payReturn'); } } catch(e){}
  setTimeout(function(){ location.href = dest; }, 1500);
</script>
</body>
</html>
