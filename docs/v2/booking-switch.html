<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto · Compare and switch</title>
<style>
  :root{
    --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#6d726c; --line:#e4dfd2;
    --jade:#0f8a63; --jade-deep:#063f2f; --jade-soft:#e7f3ec; --gold:#f2c14e;
    --amber:#a2610a; --amber-soft:#fdf3e2; --amber-line:#e8cf9f;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 44px rgba(40,30,10,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  [hidden]{display:none !important;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px;}

  .topnav{position:sticky;top:0;z-index:80;background:rgba(250,247,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topnav-in{max-width:1060px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:20px;}
  .tn-brand{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em;}
  .tn-brand span{color:var(--gold);}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#5b5650;text-decoration:none;
    padding:8px 12px;border-radius:9px;}
  .back:hover{background:rgba(255,255,255,.7);color:var(--ink);}
  .back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .page{max-width:1060px;margin:0 auto;padding:30px 28px 72px;}

  /* Two columns, matching the PDP: what they hold and how the swap works on the
     left, everything transactional in a sticky rail on the right. */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0 34px;align-items:start;}
  .colL{grid-column:1;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:16px;align-self:stretch;}
  .rail{grid-column:2;grid-row:1;min-width:0;}

  /* The photo takes up the slack between the column and the rail. The cap is a
     backstop for an unusually tall rail, not a target — normally it settles
     wherever the rail ends so the two columns finish level. */
  .photo{position:relative;flex:1 1 auto;min-height:220px;max-height:440px;
    border-radius:18px;overflow:hidden;background:#e7e1d6;}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  /* same overlay label the PDP hero uses — without it the shot reads as a
     stock image rather than the room being booked */
  .badge{position:absolute;top:16px;left:16px;background:rgba(20,18,16,.78);color:#fff;
    font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;backdrop-filter:blur(4px);}
  .rail-in{position:sticky;top:71px;}   /* nav is 62px + 1px border, parked 8px under */

  /* ===== title block — same shape as the PDP ===== */
  .hd{margin:0 0 24px;padding:4px 0 0;}
  .hd .stars{display:flex;gap:4px;height:16px;line-height:0;margin-bottom:11px;}
  .hd .stars svg{width:16px;height:16px;display:block;fill:var(--gold);}
  .hd h1{font-family:Georgia,serif;font-size:40px;line-height:1.1;letter-spacing:-.015em;margin:0;}
  .pt-sub{margin:8px 0 0;color:var(--muted);font-size:17px;}
  /* standalone variant, for the states with no rail to sit beside */
  .hd-box{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;margin-bottom:20px;}
  .hd-paid-t{font-size:14px;color:var(--muted);}
  .hd-paid-v{font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}

  /* ===== price-changed interstitial — leads with the change ===== */
  .chg{border-radius:16px;padding:20px 22px;margin:0 0 24px;border:1px solid var(--amber-line);background:var(--amber-soft);}
  .chg-k{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.11em;
    text-transform:uppercase;color:var(--amber);margin-bottom:9px;}
  .chg-k svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .chg h2{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:0 0 7px;color:#5c3a06;}
  .chg p{font-size:14.5px;color:#6d4d17;margin:0;}
  .chg-num{display:flex;flex-wrap:wrap;gap:26px;margin-top:14px;padding-top:14px;border-top:1px solid var(--amber-line);}
  .chg-num div{font-size:13px;color:#6d4d17;}
  .chg-num b{display:block;font-size:19px;font-weight:700;color:#5c3a06;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;margin-top:2px;}
  .chg-num .was b{color:#8d7a5c;text-decoration:line-through;text-decoration-thickness:1.5px;}

  .src{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 12px 4px 10px;
    font-size:12.5px;font-weight:700;}
  .src.owned{background:var(--jade-soft);color:var(--jade-deep);}
  .src.owned .dot{width:7px;height:7px;border-radius:50%;background:var(--jade);flex:none;}
  .src.tracked{background:#fff;border:1px solid #d7d0c2;color:#5b5650;}
  .src.tracked svg{width:13px;height:13px;stroke:#8a857d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ===== the rail: the PDP's "Your stay" card, same shell and sub-cards =====
     The stay is fixed here — it has to match what they already booked — so the
     rows are static, without the PDP's chevrons and click targets. */
  .book{background:var(--card);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;}
  .book-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .book-hd h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0;}
  .stay-cards{display:flex;flex-direction:column;gap:10px;}
  .tripchip{background:#fff;border:1px solid #ece5d6;border-radius:18px;padding:12px 14px;
    display:flex;align-items:center;gap:13px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 5px 16px rgba(40,30,10,.07);}
  .sc-ic{width:36px;height:36px;flex:none;border-radius:11px;background:var(--jade-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;}
  .sc-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .sc-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .tc-k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .tc-cnt{text-transform:none;letter-spacing:normal;font-weight:400;font-size:11.5px;color:var(--muted);}
  .tc-cnt::before{content:"·";margin:0 5px;}
  .tc-v{font-size:16px;font-weight:600;color:var(--ink);}
  .sr-det{font-size:13.5px;color:var(--muted);line-height:1.35;}

  /* total: price then the saving, flush inside the card like the PDP */
  .totalcard{background:none;border:none;padding:18px 0 0;}
  .bk-l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .bk-l1 b{font-family:Georgia,serif;font-size:30px;font-weight:600;color:var(--ink);
    letter-spacing:-.015em;line-height:1;}
  .bk-l1 span{font-size:14px;color:var(--muted);white-space:nowrap;}
  .bk-l2{font-size:14.5px;color:var(--jade-deep);font-weight:600;margin-top:9px;
    display:flex;align-items:center;gap:8px;}
  .bk-l2 svg{width:16px;height:16px;stroke:var(--jade);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .cta-stack{margin-top:18px;display:flex;flex-direction:column;gap:10px;}

  /* ===== outcome: saving, or an option with the tradeoff named ===== */
  .out{margin-top:22px;border-radius:16px;padding:22px;border:1px solid var(--line);background:var(--card);}
  .out.save{background:var(--jade-soft);border-color:#bfdccd;}
  .out-big{font-family:Georgia,serif;font-size:34px;letter-spacing:-.02em;color:var(--jade-deep);margin:0 0 4px;
    font-variant-numeric:tabular-nums;}
  .out-p{font-size:14.5px;color:#3f5c4f;margin:0;}
  .out.opt .out-big{font-family:inherit;font-size:24px;font-weight:700;color:var(--ink);}
  .out.opt .out-p{color:var(--muted);}

  /* ===== left box: what they hold, and what happens if they switch ===== */
  .seq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;}
  .paid-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;}
  /* the rule only earns its place when something follows it */
  .seq .paid-row:not(:last-child){padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .seq-line{font-size:14px;color:var(--muted);margin:0;}
  .seq-line b{color:var(--ink);font-weight:700;}

  /* ===== action bar ===== */
  .act{margin-top:16px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .btn{border:1px solid #d9d1c1;background:#fff;color:var(--ink);border-radius:12px;padding:13px 22px;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;
    align-items:center;justify-content:center;gap:9px;transition:background .15s,border-color .15s;}
  .btn:hover{background:#faf7f1;border-color:#c2b8a4;}
  .btn.jade{background:var(--jade);border-color:var(--jade);color:#fff;}
  .btn.jade:hover{background:var(--jade-deep);border-color:var(--jade-deep);}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .btn.grow{flex:1 1 100%;}
  /* tertiary: the way out, present but never competing with the commit action */
  .tert{flex:1 1 100%;text-align:center;background:none;border:none;padding:3px 4px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;}
  .tert:hover{color:var(--ink);text-decoration:underline;}

  /* confirm step — sits inside the rail card, restating that the old booking
     is untouched at the one moment the user is about to pay */
  .confirm{margin-top:14px;background:#f6faf8;border:1px solid #bfdccd;border-radius:12px;padding:15px;}
  .confirm h3{font-size:15px;font-weight:700;margin:0 0 5px;}
  .confirm p{font-size:13.5px;color:var(--muted);margin:0 0 12px;}
  .confirm p b{color:var(--ink);}


  @media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important;} }

  @media(max-width:940px){
    /* one column: their price, then ours with the action, then how it works */
    .cols{grid-template-columns:1fr;gap:0;}
    .rail,.colL{grid-column:1;grid-row:auto;}
    /* single column: a fixed band, since there is no rail height to match and
       an aspect ratio would fight the max-height above */
    .photo{flex:none;height:230px;min-height:0;max-height:none;}
    .rail{margin:16px 0 0;}
    .rail-in{position:static;}
    .seq{margin-top:16px;}
  }
  @media(max-width:720px){
    .page{padding:22px 16px 56px;}
    .hd h1{font-size:30px;}
    .seq{padding:20px 18px;}
    .out{padding:18px;}
    .out-big{font-size:29px;}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="tn-brand" href="home2.html">onto<span>.</span></a>
      <a class="back" href="bookings.html">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Bookings</a>
    </div>
  </nav>

  <div class="page" id="page"></div>

<script src="tracking-data.js"></script>
<script>
(function(){
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var T = window.Tracking, fmt = T.fmt;
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || 'bk-taj-exotica';
  /* 'reduced' | 'gone' | 'unavailable' — set by the alert link when the live
     price no longer matches what we messaged. */
  var changed = qs.get('changed');

  var ICON = {
    ext:  '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    tick: '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    alert:'<svg viewBox="0 0 24 24"><path d="M12 8v5M12 17v0M10.3 3.9L2.4 18a1.8 1.8 0 0 0 1.6 2.7h16a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.9 1.9 0 0 0-3.4 0z"/></svg>',
    chat: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.3 8.3 0 0 1 3.5 11.5a8.5 8.5 0 1 1 17.5 0z"/></svg>',
    /* same three the PDP's "Your stay" rows use */
    cal:  '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
    gst:  '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><path d="M16 6.5a3 3 0 0 1 0 5.4M17 14.4c1.9.6 3.2 2 3.7 4.1"/></svg>',
    bed:  '<svg viewBox="0 0 24 24"><path d="M3 18v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4M3 18v2M21 18v2M6 12V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/></svg>',
    /* SVG star, not the ★ glyph — the viewBox is cropped to the path so the row's
       height is the drawing rather than whatever inset the fallback font gives */
    star: '<svg viewBox="2.25 2.5 18.9 18.9" preserveAspectRatio="xMidYMin" aria-hidden="true">' +
          '<path d="M12 2.5l2.9 6.26 6.85.77-5.09 4.63 1.4 6.74L12 17.5l-6.06 3.4 1.4-6.74L2.25 9.53l6.85-.77z"/></svg>'
  };

  var b = T.get(id);
  if(!b || b.ownership !== 'tracked'){
    document.getElementById('page').innerHTML =
      '<div class="hd"><h1>This booking can’t be compared</h1></div>' +
      '<p style="color:#6d726c">Open it from <a href="bookings.html">your bookings</a>.</p>';
    return;
  }

  /* ---------- apply the "price moved" overlay, if any ----------
     We never silently swap the number and never show the stale one: the
     alerted figure is kept so the interstitial can state both. */
  var alertedOurTotal = null;
  if(b.our_offer){
    if(changed === 'reduced'){
      alertedOurTotal = b.our_offer.our_price_total - 1600;   // we alerted a lower price
    } else if(changed === 'gone'){
      alertedOurTotal = b.our_offer.our_price_total;
      b.our_offer.our_price_total = b.price_paid_total + 1500; // now dearer than theirs
    } else if(changed === 'unavailable'){
      alertedOurTotal = b.our_offer.our_price_total;
      b.our_offer.availability = 'sold_out';
    }
  }
  var c = T.compare(b);

  /* ---------- pieces ---------- */
  function header(){
    return '<div class="hd">' +
      '<div class="stars" aria-label="' + b.stars + '-star hotel">' +
        new Array(b.stars + 1).join(ICON.star) + '</div>' +
      '<h1>' + esc(b.property_name_raw) + '</h1>' +
      '<p class="pt-sub">' + esc(b.location) + '</p>' +
    '</div>';
  }

  /* What they already hold. The stay itself is in the rail — this is only the
     receipt for it. */
  function paidRow(){
    return '<div class="paid-row">' +
      '<span class="src tracked">' + ICON.ext + 'On ' + esc(b.platform.label) + '</span>' +
      '<span class="hd-paid-t">You paid</span>' +
      '<span class="hd-paid-v">' + fmt.inr(b.price_paid_total) + '</span>' +
    '</div>';
  }

  function interstitial(){
    if(!changed) return '';

    if(changed === 'unavailable'){
      return '<section class="chg">' +
        '<div class="chg-k">' + ICON.alert + 'Changed since we messaged you</div>' +
        '<h2>The room is no longer available with us for your dates</h2>' +
        '<p>' + esc(b.room_category) + ' at ' + esc(b.property_name_raw) + ' sold out with us after we sent your alert. ' +
          'Your ' + esc(b.platform.label) + ' booking is unaffected. We’ll keep checking and message you if it opens up.</p>' +
      '</section>';
    }

    if(changed === 'gone'){
      var nowMore = b.our_offer.our_price_total - b.price_paid_total;
      return '<section class="chg">' +
        '<div class="chg-k">' + ICON.alert + 'Changed since we messaged you</div>' +
        '<h2>The saving is gone</h2>' +
        '<p>Our price rose after we sent your alert. ' + esc(b.property_name_raw) +
          ' is now ' + fmt.inr(nowMore) + ' more with us than you paid on ' + esc(b.platform.label) +
          '. Your booking there is unaffected, and we’ll keep watching.</p>' +
        '<div class="chg-num">' +
          '<div class="was">Saving when we messaged you<b>' + fmt.inr(b.price_paid_total - alertedOurTotal) + '</b></div>' +
          '<div>Our price now<b>' + fmt.inr(b.our_offer.our_price_total) + '</b></div>' +
        '</div>' +
      '</section>';
    }

    /* reduced */
    var was = b.price_paid_total - alertedOurTotal;
    return '<section class="chg">' +
      '<div class="chg-k">' + ICON.alert + 'Changed since we messaged you</div>' +
      '<h2>The saving is smaller than when we messaged you</h2>' +
      '<p>Our price rose by ' + fmt.inr(b.our_offer.our_price_total - alertedOurTotal) +
        ' after your alert went out. The comparison below is the live price.</p>' +
      '<div class="chg-num">' +
        '<div class="was">Saving when we messaged you<b>' + fmt.inr(was) + '</b></div>' +
        '<div>Saving now<b>' + fmt.inr(c.delta) + '</b></div>' +
      '</div>' +
    '</section>';
  }

  /* Right rail: our price and every action. Nothing transactional lives on the
     left, so there is one place to look when it is time to commit. */
  function chip(icon, k, cnt, value, det){
    return '<div class="tripchip">' +
      '<div class="sc-ic">' + icon + '</div>' +
      '<div class="sc-body">' +
        '<div class="tc-k">' + esc(k) + (cnt ? '<span class="tc-cnt">' + esc(cnt) + '</span>' : '') + '</div>' +
        '<div class="tc-v">' + esc(value) + '</div>' +
        (det ? '<div class="sr-det">' + esc(det) + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  function rail(){
    var o = b.our_offer;
    var det = (o.meal_plan ? o.meal_plan + ' · ' : '') +
      T.cancellationText(o.cancellation_policy, o.free_cancellation_until);

    return '<aside class="rail"><div class="rail-in">' +
      '<div class="book">' +
        '<div class="book-hd">' +
          '<h2>Your stay</h2>' +
          '<span class="src owned"><span class="dot"></span>With onto</span>' +
        '</div>' +
        '<div class="stay-cards">' +
          chip(ICON.cal, 'Dates', b.nights, fmt.dateRange(b.check_in, b.check_out)) +
          chip(ICON.gst, 'Guests', null, o.occupancy) +
          chip(ICON.bed, 'Room', null, o.room_category, det) +
        '</div>' +
        '<div class="totalcard">' +
          '<div class="bk-l1"><b>' + fmt.inr(c.ourTotal) + '</b>' +
            '<span>total · taxes incl.</span></div>' +
          (c.isSaving
            ? '<div class="bk-l2">You save ' + fmt.inr(c.delta) + ' against ' + esc(b.platform.label) + '</div>'
            : '<div class="bk-l2">' + ICON.tick + 'Still your best rate</div>') +
          '<div class="cta-stack">' + actions() + '</div>' +
        '</div>' +
      '</div>' +
    '</div></aside>';
  }

  function outcome(){
    /* No live offer and no interstitial explaining why — say why, plainly. */
    if(!c && !changed){
      return '<section class="out opt">' +
        '<p class="out-big">' + (b.property_id
          ? 'Sold out with us for your dates'
          : 'We don’t have this property') + '</p>' +
        '<p class="out-p">' + (b.property_id
          ? 'There is nothing to compare right now. We check daily and will message you if a room opens up.'
          : 'We can’t watch this price because ' + esc(b.property_name_raw) + ' is not on onto. ' +
            'Your booking on ' + esc(b.platform.label) + ' is unaffected.') + '</p>' +
      '</section>';
    }
    if(!c) return '';

    /* Cheaper with us but worse on an attribute — we don't offer it, so there
       are no two prices to lay out and no rail. */
    return '<section class="out save">' +
      '<p class="out-big">Still your best rate</p>' +
      '<p class="out-p">Nothing cheaper with the same room and meal plan.</p>' +
    '</section>';
  }

  function sequence(){
    /* The free-cancellation deadline is deliberately absent here — nothing is
       owed until they have actually booked with us. It appears on the cancel
       task afterwards, which is the only place it is a real deadline. */
    /* One box: what they paid elsewhere, and what switching involves. The order
       is the trust point and the second clause is the rule — both survive.
       Everything that used to frame them does not. */
    return '<section class="seq">' + paidRow() +
      '<p class="seq-line"><b>Book with us first</b>, then cancel on ' +
        esc(b.platform.label) + ' — we can’t cancel it for you.</p>' +
    '</section>';
  }

  function actions(){
    /* Nothing to book: keep watching is the only honest action. */
    if(!c){
      return '<div class="act">' +
        '<a class="btn jade grow" href="bookings.html">Keep watching</a>' +
        '<a class="btn grow" href="' + esc(T.WA.fix(b)) + '" target="_blank" rel="noopener">' + ICON.chat + 'Message us</a>' +
      '</div>';
    }
    /* Booking is offered only when the swap is like-for-like and cheaper. */
    if(!c.isSaving){
      return '<div class="act">' +
        '<a class="btn jade grow" href="bookings.html">Keep watching</a>' +
      '</div>';
    }
    return '<div class="act" id="act">' +
      '<button type="button" class="btn jade grow" id="book">Book with us</button>' +
      '<a class="tert" href="bookings.html">Not now</a>' +
    '</div>';
  }

  /* Two prices to lay out -> two columns. Otherwise there is nothing to
     transact, so the page stays single-column. */
  /* The photo carries the left column's height; the box carries its content. */
  var leftCol = '<div class="colL">' +
    (b.image
      ? '<div class="photo"><img src="' + esc(b.image) + '" alt="">' +
          '<span class="badge">' + esc(b.room_category) + '</span>' +
        '</div>'
      : '') +
    (c && c.isSaving ? sequence() : '<section class="seq">' + paidRow() + '</section>') +
  '</div>';

  var body = (c && c.likeForLike)
    ? '<div class="cols">' + rail() + leftCol + '</div>'
    : '<div class="hd-box">' + paidRow() + '</div>' + outcome() + actions();

  document.getElementById('page').innerHTML =
    header() + interstitial() + body;

  /* ---------- book with us -> the old booking becomes a cancel task ---------- */
  var bookBtn = document.getElementById('book');
  if(bookBtn){
    bookBtn.addEventListener('click', function(){
      var act = document.getElementById('act');
      act.insertAdjacentHTML('beforebegin',
        '<section class="confirm" id="cf">' +
          '<h3>Book for ' + fmt.inr(c.ourTotal) + '?</h3>' +
          '<p>Your <b>' + esc(b.platform.label) + '</b> booking stays untouched. ' +
            'Cancelling it is your next step — free until <b>' +
            esc(fmt.deadline(b.free_cancellation_until)) + '</b>.</p>' +
          '<div class="act" style="margin:0">' +
            '<button type="button" class="btn jade grow" id="go">Confirm and book</button>' +
            '<button type="button" class="tert" id="nope">Back</button>' +
          '</div>' +
        '</section>');
      act.hidden = true;
      document.getElementById('cf').scrollIntoView({ behavior:'smooth', block:'center' });

      document.getElementById('nope').addEventListener('click', function(){
        document.getElementById('cf').remove(); act.hidden = false;
      });
      document.getElementById('go').addEventListener('click', function(){
        /* payment is stubbed in this prototype */
        T.completeSwitch(b.id, c.ourTotal);
        location.href = 'bookings.html';
      });
    });
  }
})();
</script>
</body>
</html>
