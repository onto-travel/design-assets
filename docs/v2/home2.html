<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onto — Luxury stays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --card:#ffffff;
    --ink:#1b211e;
    --muted:#6d726c;
    --line:#e4dfd2;
    --jade:#0f8a63;
    --jade-deep:#063f2f;
    --gold:#f2c14e;
    --pill:#f1ede3;
    --info:#f1ede3;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 30px rgba(40,30,10,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  /* an open popover may reach past the fold; it must never widen the page */
  html{overflow-x:clip;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  /* the v2 design drops the serif for headings — only the wordmark keeps it */
  h1,h2{font-family:inherit;letter-spacing:-.01em;margin:0;}
  button{font-family:inherit;}

  /* the account is a name, not an initial */
  .tn-who{display:inline-flex;align-items:center;gap:7px;border:none;background:none;padding:7px 10px;
    border-radius:10px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);
    cursor:pointer;transition:background .15s;}
  .tn-who:hover{background:rgba(15,138,99,.07);}
  .tn-who .cv{width:9px;height:9px;stroke:#5b6577;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}


  /* ================= SKY ================= */
  /* A painted sky rather than a photograph: a periwinkle wash with soft cloud
     banks blurred into it, falling away to white so the page below starts
     clean. Drawn in CSS so it costs nothing and scales to any width. */
  /* the sky is the page, so it fills the viewport and the footer sits on it —
     the gradient settles on a tint rather than white so nothing bands below */
  /* No overflow:hidden here — the date and guest popovers drop out of the
     search bar and would be clipped by it. The blur gets its own layer. */
  .sky{position:relative;isolation:isolate;
    min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#cbe4d7 0%,#d8ecdf 20%,#e6f4ec 44%,#f1f9f5 66%,#f9fdfb 86%,#fff 100%);}
  .sky-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .sky-bg::before,.sky-bg::after{content:"";position:absolute;pointer-events:none;}
  /* the pink-lit bank across the upper third */
  .sky-bg::before{inset:0;
    background:
      radial-gradient(38% 26% at 12% 22%, rgba(15,138,99,.22), rgba(15,138,99,0) 70%),
      radial-gradient(34% 22% at 88% 20%, rgba(15,138,99,.19), rgba(15,138,99,0) 70%),
      radial-gradient(32% 22% at 52% 10%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%);
    filter:blur(22px);}
  /* the white bank the search bar sits on */
  .sky-bg::after{left:-10%;right:-10%;top:34%;height:62%;
    background:
      radial-gradient(46% 46% at 22% 58%, rgba(255,255,255,.92), rgba(255,255,255,0) 72%),
      radial-gradient(52% 42% at 72% 46%, rgba(255,255,255,.86), rgba(255,255,255,0) 72%),
      radial-gradient(40% 38% at 48% 74%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%);
    filter:blur(26px);}
  .sky > *{position:relative;z-index:1;}

  /* nav on the sky — the mark, and who you are */
  .skynav{position:absolute;top:0;left:0;right:0;z-index:6;
    width:100%;max-width:1380px;margin:0 auto;padding:22px 30px 0;
    display:flex;align-items:center;}
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:-.01em;
    color:var(--ink);text-decoration:none;}
  .skynav .tn-right{margin-left:auto;position:relative;display:flex;align-items:center;}

  /* centred in the sky, then lifted: the extra floor under the block sits it
     a little above the true middle, which reads better than dead centre */
  .sky-mid{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:88px 0 208px;}
  .hero2{text-align:center;padding:0 24px;}
  .hero2 h1{font-size:62px;line-height:1.08;letter-spacing:-.03em;font-weight:700;color:#0d1220;}
  .hero2 p{margin:14px 0 0;font-size:16px;font-weight:500;color:#5b6577;}

  /* ================= SEARCH BAR ================= */
  /* Three fields and the verb. Each field is its own pill so the one you are
     filling reads as a separate object, and the button is a mark, not a word —
     at this size the magnifier is unambiguous. */
  /* sized to its fields and centred — auto margins alone are unreliable for a
     flex item inside a column, and the bar was stretching to the full width */
  .sbar{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;
    width:fit-content;max-width:100%;margin:48px auto 0;padding:0 24px;}
  .sseg{position:relative;flex:none;display:flex;align-items:center;gap:11px;background:#fff;
    border:1.5px solid transparent;border-radius:20px;padding:0 20px;height:60px;min-width:0;
    cursor:pointer;text-align:left;box-shadow:0 6px 18px rgba(18,60,45,.10);
    transition:border-color .15s,box-shadow .15s;}
  .sseg:hover{box-shadow:0 8px 22px rgba(18,60,45,.15);}
  .sseg.open{border-color:var(--jade);}
  .sseg > svg{width:20px;height:20px;stroke:#0d1220;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .sseg .cv{width:14px;height:14px;stroke:#6b7280;stroke-width:2;margin-left:2px;}
  .sseg-tx{display:flex;flex-direction:column;min-width:0;}
  .sseg-tx em{font-style:normal;font-size:12.5px;font-weight:500;color:#6b7280;line-height:1.2;}
  .sseg-tx b{font-size:15px;font-weight:700;color:#0d1220;line-height:1.3;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .sseg.dest{width:240px;}
  .sseg.dest input{border:none;outline:none;background:none;font-family:inherit;font-size:15.5px;
    font-weight:500;color:#0d1220;width:100%;min-width:0;padding:0;}
  .sseg.dest input::placeholder{color:#8a91a0;font-weight:500;}
  /* nights, stated on the field rather than counted from the dates */
  .nights{flex:none;background:#eef0f4;border-radius:7px;padding:3px 8px;
    font-size:11.5px;font-weight:700;color:#3b4252;font-variant-numeric:tabular-nums;}
  .nights:empty{display:none;}
  /* the people already on the search, named */
  .who-chips{display:flex;align-items:center;gap:5px;min-width:0;}
  .who-chips i{font-style:normal;background:#eef0f6;border-radius:7px;padding:2px 8px;
    font-size:12.5px;font-weight:700;color:#2b3242;white-space:nowrap;}
  .sgo{flex:none;align-self:center;width:56px;height:56px;border:none;border-radius:17px;background:#1b2233;
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(18,40,32,.26);transition:background .15s,transform .12s;}
  .sgo:hover{background:#0d1220;}
  .sgo:active{transform:scale(.97);}
  .sgo svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;}

  /* where they left off */
  .resume{display:flex;align-items:center;gap:16px;width:100%;max-width:560px;
    margin:56px auto 0;background:#fff;border:none;border-radius:18px;padding:14px 18px 14px 14px;
    font-family:inherit;text-align:left;cursor:pointer;text-decoration:none;color:inherit;
    box-shadow:0 6px 20px rgba(18,60,45,.12);transition:transform .12s,box-shadow .15s;}
  .resume:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(18,60,45,.18);}
  .resume img{flex:none;width:56px;height:44px;border-radius:11px;object-fit:cover;display:block;}
  .resume-tx{flex:1;min-width:0;}
  .resume-h{font-size:15px;font-weight:700;color:#0d1220;}
  .resume-s{font-size:13px;font-weight:500;color:#6b7280;margin-top:2px;}
  .resume-ar{flex:none;color:#9aa1ae;font-size:20px;line-height:1;}



  /* popovers (dates + guests) */
  .pop{position:absolute;top:calc(100% + 12px);background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 16px 44px rgba(40,30,10,.18);z-index:40;padding:16px;
    opacity:0;transform:translateY(-6px);pointer-events:none;visibility:hidden;
    transition:opacity .15s,transform .15s,visibility .15s;}
  .pop.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;}
  .pop-dates{left:0;width:328px;}
  .pop-guests{right:0;width:322px;}
  .pop-dest{left:0;width:360px;padding:8px;}
  .seg-input{display:block;width:100%;border:none;background:none;padding:0;margin:0;
    font-family:inherit;font-size:15.5px;font-weight:600;color:var(--ink);outline:none;}
  .seg-input::placeholder{color:#a49d90;font-weight:500;}
  .sug{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .12s;}
  .sug:hover{background:#f1ede3;}
  .sug .sug-ic{width:38px;height:38px;border-radius:9px;background:#eef6f1;color:var(--jade);flex:none;
    display:flex;align-items:center;justify-content:center;}
  .sug .sug-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sug .sug-t{min-width:0;}
  .sug .sug-n{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sug .sug-s{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .pop-empty{padding:14px 12px;color:var(--muted);font-size:13.5px;text-align:center;}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head b{font-size:15px;font-weight:700;}
  .cal-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    cursor:pointer;color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .13s;}
  .cal-nav:hover:not(:disabled){border-color:#c2b8a4;background:#faf8f3;}
  .cal-nav:disabled{opacity:.3;cursor:default;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;}
  .cal-d{aspect-ratio:1;border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:500;
    color:var(--ink);border-radius:9px;position:relative;transition:background .1s;font-family:inherit;}
  .cal-d:hover:not(:disabled){background:#faf8f3;}
  .cal-d:disabled{color:#cfc8bb;cursor:default;}
  .cal-d.in-range{background:#e2ece2;border-radius:0;}
  .cal-d.edge{background:var(--jade);color:#fff;}
  .cal-d.edge.s{border-radius:9px 0 0 9px;}
  .cal-d.edge.e{border-radius:0 9px 9px 0;}
  .cal-d.edge.only{border-radius:9px;}
  .cal-hint{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center;}

  /* guests stepper */
  .gst{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;}
  .gst + .gst{border-top:1px solid var(--line);}
  .gst .gl{font-size:14.5px;font-weight:600;}
  .gst .gl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px;}
  .stp{display:flex;align-items:center;gap:12px;}
  .stp button{width:32px;height:32px;border-radius:50%;border:1px solid #d3ccbe;background:#fff;
    color:var(--jade);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .13s;}
  .stp button:hover:not(:disabled){border-color:var(--jade);background:#eef6f1;}
  .stp button:disabled{opacity:.35;cursor:default;}
  .stp b{min-width:16px;text-align:center;font-size:15px;font-weight:600;}
  .pop-done{width:100%;margin-top:6px;background:var(--jade);color:#fff;border:none;border-radius:11px;
    padding:11px;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .14s;}
  .pop-done:hover{background:var(--jade-deep);}

  /* guest picker (companions + age groups), ported from the hotel page */
  .gp-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:2px 2px 9px;}
  .gp-reg{padding-bottom:13px;margin-bottom:4px;border-bottom:1px solid var(--line);}
  .gp-reg:has(> .gp-chips:empty){display:none;}
  .gp-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .reg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
    padding:6px 11px 6px 10px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;
    cursor:pointer;font-family:inherit;transition:all .15s;}
  .reg-chip:hover{border-color:var(--jade);background:#eef6f1;}
  .reg-chip .rc-em{font-size:14px;}
  .reg-chip .rc-plus{color:var(--jade);font-weight:700;font-size:14px;margin-left:1px;}
  .gp-allin{font-size:12.5px;color:var(--muted);padding:2px;}
  .gp-catg{padding:11px 0 4px;}
  .gp-catg + .gp-catg{border-top:1px solid var(--line);}
  .gp-chead{display:flex;align-items:center;padding:0 2px 2px;}
  .gp-chead .gpc-name{font-size:14.5px;font-weight:600;color:var(--ink);}
  .gp-chead .gpc-sub{font-size:12px;color:var(--muted);}
  .gp-chead .gpc-sub::before{content:"·";margin:0 6px;color:#c3bcae;}
  .gp-chead .gpc-count{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--jade);
    min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#eef6f1;
    display:inline-flex;align-items:center;justify-content:center;}
  .gp-people{display:flex;flex-wrap:wrap;gap:6px;padding:9px 2px 4px;}
  .gp-people:empty{display:none;}
  .person{display:inline-flex;align-items:center;gap:5px;border:1px solid #cdd8e6;border-radius:20px;
    padding:5px 5px 5px 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--jade);background:#eef6f1;}
  .person:not(.is-comp){background:#faf8f3;border-color:#e4dcc9;color:var(--ink);}
  .person .person-em{font-size:14px;}
  .person .person-name{border:none;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;
    border-bottom:1px dashed #c9c0ae;}
  .person.custom .person-name{border-bottom-color:transparent;}
  .person .person-x{border:none;background:none;cursor:pointer;color:#9a948c;font-size:17px;line-height:1;
    padding:0 3px;border-radius:50%;transition:color .15s;}
  .person .person-x:hover{color:#b03636;}
  .person-in{width:118px;border:1px solid var(--jade);border-radius:20px;padding:5px 12px;font-family:inherit;
    font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;outline:none;}
  .gp-chead .gp-add{margin-left:8px;flex:none;width:25px;height:25px;padding:0;border-radius:50%;
    border:1px solid var(--line);background:#fff;color:var(--jade);font-size:17px;line-height:1;
    cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
  .gp-chead .gp-add:hover{border-color:var(--jade);background:#eef6f1;}
  .gp-chead .gp-add:disabled{opacity:.4;cursor:default;}
  /* guests / rooms toggle */
  .gp-tabs{display:flex;background:#f1ede3;border-radius:11px;padding:3px;gap:2px;margin-bottom:12px;}
  .gp-tab{flex:1;border:none;background:none;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:600;
    color:var(--muted);cursor:pointer;padding:8px;transition:background .15s,color .15s,box-shadow .15s;}
  .gp-tab:hover{color:var(--ink);}
  .gp-tab.is-on{background:#fff;color:var(--jade);box-shadow:0 1px 3px rgba(40,30,10,.14);}
  .gp-panel[hidden]{display:none;}
  .gp-roomrow{display:flex;align-items:center;gap:14px;padding:6px 2px 2px;}
  .gp-roomrow .gpr-name{font-size:15px;font-weight:600;color:var(--ink);}
  .gp-stepper{margin-left:auto;display:inline-flex;align-items:center;gap:6px;}
  .gp-step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--jade);
    font-size:20px;line-height:1;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
  .gp-step:hover:not(:disabled){border-color:var(--jade);background:#eef6f1;}
  .gp-step:disabled{opacity:.4;cursor:default;}
  .gp-stepval{min-width:24px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .gp-roomhint{font-size:12px;color:var(--muted);margin:13px 2px 2px;padding-top:12px;border-top:1px solid var(--line);}

  .footer{position:absolute;bottom:0;left:0;right:0;
    width:100%;max-width:1180px;margin:0 auto;padding:22px 30px 30px;
    color:#6b7280;font-size:13px;font-weight:500;
    border-top:1px solid rgba(27,34,51,.10);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:10px;}

  @media(max-width:900px){
    .hero2{padding-top:44px;}
    .hero2 h1{font-size:40px;}
    /* the bar stacks, so each field takes the width and the verb spans it */
    .sbar{flex-direction:column;align-items:stretch;width:100%;max-width:460px;gap:8px;}
    .sseg{flex:auto;}
    .sseg,.sseg.dest{width:auto;}
    .sgo{width:100%;height:54px;border-radius:16px;}
    .pop{left:0;right:0;width:auto;}
    .pop-dates,.pop-guests{left:0;right:0;width:auto;}
    .sky-mid{padding:80px 0 150px;}
  }
</style>

<!-- ================= SKY ================= -->
<section class="sky">
  <div class="sky-bg" aria-hidden="true"></div>
  <nav class="skynav">
    <a class="brand" href="home2.html">onto</a>
    <div class="tn-right">
      <button type="button" class="tn-who" id="profileBtn" aria-haspopup="true" aria-expanded="false">
        <span id="whoName">Saanvi</span>
        <svg class="cv" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
      </button>
<div class="menu" id="profileMenu" role="menu">
        </div>
    </div>
  </nav>

  <div class="sky-mid">
  <div class="hero2">
    <h1>Find your kind of stay</h1>
    <p>Find boutique stays. Compare what matters.</p>
  </div>

  <div class="sbar">
    <div class="sseg dest" id="segDest">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <input type="text" id="hotelInput" placeholder="Where to?" autocomplete="off" spellcheck="false">
      <div class="pop pop-dest" id="popDest"></div>
    </div>

    <div class="sseg when" id="segDates" role="button" tabindex="0">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v4M16 3v4"/></svg>
      <span class="sseg-tx"><em>When</em><b id="datesVal">Add dates</b></span>
      <span class="nights" id="nightsBadge"></span>
      <svg class="cv" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
      <div class="pop pop-dates" id="popDates">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrev">‹</button>
          <b id="calTitle">Month</b>
          <button type="button" class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-hint" id="calHint">Select your check-in date</div>
      </div>
    </div>

    <div class="sseg who" id="segGuests" role="button" tabindex="0">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><path d="M16 6.5a3 3 0 0 1 0 5.4M17 14.4c1.9.6 3.2 2 3.7 4.1"/></svg>
      <span class="sseg-tx"><em>Who all</em><span class="who-chips" id="guestsVal"><i>1 Adult</i></span></span>
      <svg class="cv" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
      <div class="pop pop-guests" id="popGuests">
        <div class="gp-tabs" role="tablist">
          <button type="button" class="gp-tab is-on" data-tab="guests">Guests</button>
          <button type="button" class="gp-tab" data-tab="rooms">Rooms</button>
        </div>
        <div class="gp-panel" id="panelGuests">
          <div class="gp-reg">
            <div class="gp-lab">Regular companions</div>
            <div class="gp-chips" id="regChips"></div>
          </div>
          <div class="gp-catg">
            <div class="gp-chead"><span class="gpc-name">Adults</span><span class="gpc-sub">Age 13+</span><span class="gpc-count" id="adCount">1</span><button type="button" class="gp-add" data-cat="adults" aria-label="Add adult">+</button></div>
            <div class="gp-people" id="adPeople"></div>
          </div>
          <div class="gp-catg">

            <div class="gp-chead"><span class="gpc-name">Infants</span><span class="gpc-sub">Under 2 &middot; free</span><span class="gpc-count" id="inCount">0</span><button type="button" class="gp-add" data-cat="infants" aria-label="Add infant">+</button></div>

              <button type="button" class="gp-step" id="roomMinus" aria-label="Fewer rooms">&minus;</button>
              <span class="gp-stepval" id="roomVal">1</span>

<script>
/* =============================================================
   PROFILE MENU + ORDERS
   ============================================================= */
(function(){
  var pBtn = document.getElementById('profileBtn');
  var pMenu = document.getElementById('profileMenu');
  if(pBtn && pMenu){
    pBtn.addEventListener('click', function(e){ e.stopPropagation(); var o=pMenu.classList.toggle('open'); pBtn.setAttribute('aria-expanded', o?'true':'false'); });
    document.addEventListener('click', function(e){ if(!pMenu.contains(e.target) && !pBtn.contains(e.target)){ pMenu.classList.remove('open'); pBtn.setAttribute('aria-expanded','false'); } });
  }

})();

/* =============================================================
   GUESTS PICKER — companions segregate into age groups (from the hotel page)
   ============================================================= */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var seg = $('segGuests'), pop = $('popGuests');

  // the account holder's name lives in the Travellers store ("Myself"); default "Saanvi"
  var TKEY = 'onto:travellers:v3';
  function readUserName(){ try{ var a=JSON.parse(localStorage.getItem(TKEY))||[]; var me=a.find(function(t){return t.relation==='Myself'||t.id==='t-you';}); if(me&&me.name&&me.name.toLowerCase()!=='you'&&me.name.indexOf('@')<0) return me.name; }catch(e){} return 'Saanvi'; }
  function writeUserName(n){ try{ var a=JSON.parse(localStorage.getItem(TKEY)); if(!Array.isArray(a)) a=[]; var me=a.find(function(t){return t.relation==='Myself'||t.id==='t-you';}); if(me) me.name=n; else a.unshift({id:'t-you',name:n,relation:'Myself',interests:[]}); localStorage.setItem(TKEY, JSON.stringify(a)); }catch(e){} }
  var FUN_EMOJI = ['🦊','🐨','🐼','🦁','🐧','🐬','🦉','🐢','🐝','🦩'];
  function emojiFor(name){ var h=0,s=String(name||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return FUN_EMOJI[h % FUN_EMOJI.length]; }
  function catFor(t){ if(t.relation==='Myself') return 'adults'; if(typeof t.age==='number'){ if(t.age<2) return 'infants'; if(t.age<13) return 'children'; return 'adults'; } if(t.relation==='Child') return 'children'; return 'adults'; }
  function loadCompanions(){
    var arr=[]; try{ arr=JSON.parse(localStorage.getItem(TKEY))||[]; }catch(e){} if(!Array.isArray(arr)) arr=[];
    var me=arr.filter(function(t){return t.relation==='Myself'||t.id==='t-you';})[0];
    var list=[{id:'you', em:(me&&me.emoji)||emojiFor(readUserName()), name:readUserName(), cat:'adults'}];
    arr.filter(function(t){return t.relation!=='Myself'&&t.id!=='t-you';}).forEach(function(t){
      list.push({id:t.id, em:t.emoji||emojiFor(t.name), name:t.name, cat:catFor(t)});
    });
    return list;
  }
  var COMPANIONS = loadCompanions();
  /* the bar names the person; only the menu's disc is an initial. Writing the
     initial into the button itself would replace its label and chevron. */
  try{ var _un=readUserName(), _ini=(_un[0]||'S').toUpperCase();
       var _mn=document.getElementById('menuName'); if(_mn) _mn.textContent = _un;
       var _na=document.getElementById('whoName');  if(_na) _na.textContent = _un;
       var _ma=document.getElementById('menuAvatar'); if(_ma) _ma.textContent = _ini; }catch(e){}
  var EM  = { adults:'🧍', children:'🧒', infants:'👶' };
  var FUN = {
    adults:  ["Captain Mango","Wanderer Kai","Skipper Reef","Sunny Coco","Palm Rover"],
    children:["Little Tiger","Coco Pop","Captain Nemo","Sandy Toes","Mango Bean"],
    infants: ["Little Pebble","Baby Sprout","Tiny Coco","Wee Mango","Baby Reef"]
  };
  var MAP = {}; COMPANIONS.forEach(function(c){ MAP[c.id] = c; });
  var CATS   = ['adults','children','infants'];
  var PEOPLE = { adults:'adPeople', children:'chPeople', infants:'inPeople' };
  var COUNT  = { adults:'adCount',  children:'chCount',  infants:'inCount'  };
  var MIN    = { adults:1, children:0, infants:0 };   // keep at least one adult
  var MAXG   = 9;

  // each person is {companion:id}  OR  {auto:true, em, name, custom?}
  // restore the shared party (else default to the same set as the hotel page)
  var party;
  try{ party = JSON.parse(sessionStorage.getItem('searchGuests')); }catch(e){}
  if(!party || !party.adults) party = { adults:[{companion:'you'}], children:[], infants:[] };
  // guest-picker.js writes a 2-category party (no infants); backfill so this 3-category reader can't crash
  if(!party.children) party.children = [];
  if(!party.infants)  party.infants  = [];
  // drop any stale companions no longer defined (after removing seeded people)
  CATS.forEach(function(c){ if(party[c]) party[c] = party[c].filter(function(p){ return !p.companion || MAP[p.companion]; }); });
  var funN  = { adults:0, children:0, infants:0 };

  var joinNames = function(a){ return a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' & '+a[a.length-1]; };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var heads = function(){ return CATS.reduce(function(n,c){ return n + party[c].length; }, 0); };
  var usedIds = function(){ var s = new Set(); CATS.forEach(function(c){ party[c].forEach(function(p){ if(p.companion) s.add(p.companion); }); }); return s; };
  var knownIn = function(){ var r = []; CATS.forEach(function(c){ party[c].forEach(function(p){ if(p.companion) r.push(MAP[p.companion]); }); }); return r; };

  function addCompanion(id){
    var c = MAP[id]; if(!c || heads()>=MAXG || usedIds().has(id)) return;
    party[c.cat].push({companion:id}); apply();
  }
  function addExtra(cat){
    if(heads()>=MAXG) return;
    party[cat].push({ auto:true, em:EM[cat], name:FUN[cat][funN[cat]++ % FUN[cat].length] }); apply();
  }
  function removePerson(cat,i){
    if(party[cat].length<=MIN[cat]) return;   // adults never drop below 1
    party[cat].splice(i,1); apply();
  }

  var editing = null;   // {cat,i} — inline rename for extra (auto) people
  function commit(val){
    if(editing){ var p = party[editing.cat][editing.i]; if(p){ var v=(val||'').trim(); if(v){ if(p.companion==='you'){ MAP['you'].name=v; writeUserName(v); } else { p.name=v; p.custom=true; } } } }
    editing = null; apply();
  }

  function renderRegulars(){
    var box = $('regChips'); box.innerHTML = '';
    var used = usedIds();
    var avail = COMPANIONS.filter(function(c){ return !used.has(c.id); });
    if(!avail.length){ box.innerHTML = '<span class="gp-allin">Everyone’s added ✓</span>'; return; }
    avail.forEach(function(c){
      var b = document.createElement('button'); b.type='button'; b.className='reg-chip';
      b.innerHTML = '<span class="rc-em">'+c.em+'</span>'+esc(c.name)+'<span class="rc-plus">+</span>';
      b.addEventListener('click', function(e){ e.stopPropagation(); addCompanion(c.id); });
      box.appendChild(b);
    });
  }
  function renderPeople(){
    CATS.forEach(function(cat){
      var box = $(PEOPLE[cat]); box.innerHTML = '';
      party[cat].forEach(function(p,i){
        if(editing && editing.cat===cat && editing.i===i){
          var inp = document.createElement('input');
          inp.className='person-in'; inp.value = p.name || (p.companion && MAP[p.companion] ? MAP[p.companion].name : '') || ''; inp.maxLength=24; inp.setAttribute('aria-label','Guest name');
          inp.addEventListener('keydown', function(e){ e.stopPropagation();
            if(e.key==='Enter') commit(inp.value);
            else if(e.key==='Escape'){ editing=null; apply(); } });
          inp.addEventListener('blur', function(){ commit(inp.value); });
          setTimeout(function(){ inp.focus(); inp.select(); }, 0);
          box.appendChild(inp); return;
        }
        var c = p.companion ? MAP[p.companion] : null;
        var em = c ? c.em : p.em, name = c ? c.name : p.name;
        var chip = document.createElement('span');
        chip.className = 'person' + (p.companion ? ' is-comp' : (p.custom?' custom':''));
        var editable = !p.companion || p.companion==='you';
        var nameHTML = editable
          ? '<button type="button" class="person-name" aria-label="Rename">'+esc(name)+'</button>'
          : esc(name);
        chip.innerHTML = '<span class="person-em">'+em+'</span>'+nameHTML
          + '<button type="button" class="person-x" aria-label="Remove '+esc(name)+'">&times;</button>';
        if(editable) chip.querySelector('.person-name').addEventListener('click', function(e){ e.stopPropagation(); editing={cat:cat,i:i}; apply(); });
        chip.querySelector('.person-x').addEventListener('click', function(e){ e.stopPropagation(); removePerson(cat,i); });
        box.appendChild(chip);
      });
    });
  }

  var plural = function(n,w){ return n+' '+w+(n===1?'':'s'); };
  function composition(){
    var p = [];
    if(party.adults.length)   p.push(plural(party.adults.length,'adult'));
    if(party.children.length) p.push(party.children.length+(party.children.length===1?' child':' children'));
    if(party.infants.length)  p.push(plural(party.infants.length,'infant'));
    return p.join(' · ') || 'Add guests';
  }

  function apply(){
    try{ sessionStorage.setItem('searchGuests', JSON.stringify(party)); }catch(e){}
    CATS.forEach(function(cat){ var el=$(COUNT[cat]); if(el) el.textContent = party[cat].length; });
    renderRegulars(); renderPeople();
    pop.querySelectorAll('.gp-add').forEach(function(b){ b.disabled = heads()>=MAXG; });
    var nm = knownIn().map(function(c){ return c.name; });
    var extra = heads() - nm.length;
    var _n = heads();
    var _r = (typeof roomsCount==='number'?roomsCount:1);
    /* the people on the search, named — a chip each, the rest counted */
    var _shown = nm.length ? nm.slice(0, 2) : [composition()];
    var _more  = (nm.length ? nm.length - _shown.length : 0) + (extra > 0 ? extra : 0);
    $('guestsVal').innerHTML = _shown.map(function(t){
      return '<i>' + String(t).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }) + '</i>';
    }).join('') + (_more > 0 ? '<i>+' + _more + '</i>' : '');
    var _gc = $('guestCnt'); if(_gc) _gc.textContent = '· ' + _n + ' guest' + (_n>1?'s':'') + ' · ' + _r + ' room' + (_r>1?'s':'');
  }

  pop.querySelectorAll('.gp-add').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); addExtra(b.dataset.cat); }); });

  // guests / rooms toggle + rooms stepper (rooms count is shown in the guests title)
  var roomsCount = 1;
  try{ var _pr=JSON.parse(sessionStorage.getItem('searchRooms')); if(_pr) roomsCount=Math.min(5,Math.max(1,_pr)); }catch(e){}
  (function(){
    var tabs = pop.querySelectorAll('.gp-tab');
    var panels = { guests: $('panelGuests'), rooms: $('panelRooms') };
    tabs.forEach(function(t){ t.addEventListener('click', function(e){ e.stopPropagation();
      tabs.forEach(function(x){ x.classList.toggle('is-on', x===t); });
      Object.keys(panels).forEach(function(k){ if(panels[k]) panels[k].hidden = (k !== t.dataset.tab); });
    }); });
    var MINR=1, MAXR=5, rv=$('roomVal');
    function renderRooms(){ rv.textContent=roomsCount; $('roomMinus').disabled=roomsCount<=MINR; $('roomPlus').disabled=roomsCount>=MAXR; try{ sessionStorage.setItem('searchRooms', JSON.stringify(roomsCount)); }catch(e){} }
    $('roomMinus').addEventListener('click', function(e){ e.stopPropagation(); roomsCount=Math.max(MINR,roomsCount-1); renderRooms(); apply(); });
    $('roomPlus').addEventListener('click', function(e){ e.stopPropagation(); roomsCount=Math.min(MAXR,roomsCount+1); renderRooms(); apply(); });
    renderRooms();
  })();

  seg.addEventListener('click', function(e){
    if(pop.contains(e.target)) return;
    closeAll(pop); pop.classList.toggle('open');
  });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });

  apply();
})();

/* =============================================================
   DATE RANGE CALENDAR
   ============================================================= */
(function(){
  var seg   = document.getElementById('segDates');
  var pop   = document.getElementById('popDates');
  var grid  = document.getElementById('calGrid');
  var title = document.getElementById('calTitle');
  var hint  = document.getElementById('calHint');
  var valEl = document.getElementById('datesVal');

  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONS= ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  // "today" — prototype anchors to a fixed date so it's deterministic.
  var today = new Date(2026, 6, 6);            // 6 Jul 2026
  today.setHours(0,0,0,0);
  var checkIn = null, checkOut = null;
  // restore the shared search dates (else default to a range matching the hotel page)
  (function(){
    try{ var s = JSON.parse(sessionStorage.getItem('searchDates'));
      if(s && s.ci && s.co){ checkIn = new Date(s.ci[0],s.ci[1],s.ci[2]); checkOut = new Date(s.co[0],s.co[1],s.co[2]); return; } }catch(e){}
    checkIn = new Date(2026,6,10); checkOut = new Date(2026,6,13);
  })();
  var view  = new Date(checkIn.getFullYear(), checkIn.getMonth(), 1);

  function key(d){ return d.getFullYear()*10000 + d.getMonth()*100 + d.getDate(); }

  function draw(){
    title.textContent = MON[view.getMonth()] + ' ' + view.getFullYear();
    document.getElementById('calPrev').disabled =
      (view.getFullYear()===today.getFullYear() && view.getMonth()===today.getMonth());

    var html = DOW.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
    var first = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
    var days  = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    for(var i=0;i<first;i++){ html += '<div></div>'; }

    for(var day=1; day<=days; day++){
      var d = new Date(view.getFullYear(), view.getMonth(), day);
      var k = key(d), cls = 'cal-d', dis = d < today;
      if(checkIn && checkOut){
        if(k > key(checkIn) && k < key(checkOut)) cls += ' in-range';
        if(k === key(checkIn)) cls += ' edge s';
        if(k === key(checkOut)) cls += ' edge e';
      } else if(checkIn && k === key(checkIn)){
        cls += ' edge only';
      }
      html += '<button type="button" class="'+cls+'" data-k="'+k+'" data-day="'+day+'"'+(dis?' disabled':'')+'>'+day+'</button>';
    }
    grid.innerHTML = html;
  }

  function fmt(d){ return MONS[d.getMonth()] + ' ' + d.getDate(); }
  function saveDates(){
    if(checkIn && checkOut){
      try{ sessionStorage.setItem('searchDates', JSON.stringify({
        ci:[checkIn.getFullYear(),checkIn.getMonth(),checkIn.getDate()],
        co:[checkOut.getFullYear(),checkOut.getMonth(),checkOut.getDate()]
      })); }catch(e){}
    }
  }
  function updateVal(){
    if(checkIn && checkOut){
      var nights = Math.round((checkOut - checkIn)/86400000);
      valEl.textContent = fmt(checkIn) + ' - ' + fmt(checkOut);
      valEl.classList.remove('ph');
      /* nights stated on the field, so the span is legible without counting */
      var _n = Math.round((checkOut - checkIn) / 86400000);
      var _nb = document.getElementById('nightsBadge');
      if(_nb) _nb.textContent = _n > 0 ? _n + 'N' : '';
      saveDates();
    } else if(checkIn){
      valEl.textContent = fmt(checkIn) + ' → …';
      (function(){ var b=document.getElementById('nightsBadge'); if(b) b.textContent=''; })();
      valEl.classList.remove('ph');
    } else {
      valEl.textContent = 'Add dates'; valEl.classList.add('ph');
      (function(){ var b=document.getElementById('nightsBadge'); if(b) b.textContent=''; })();
    }
  }

  grid.addEventListener('click', function(e){
    var b = e.target.closest('.cal-d'); if(!b || b.disabled) return;
    e.stopPropagation();
    var day = +b.dataset.day;
    var d = new Date(view.getFullYear(), view.getMonth(), day);
    if(!checkIn || (checkIn && checkOut)){
      checkIn = d; checkOut = null;
      hint.textContent = 'Select your check-out date';
    } else if(d <= checkIn){
      checkIn = d;               // clicked earlier → restart range
    } else {
      checkOut = d;
      hint.textContent = 'Great — dates set';
    }
    draw(); updateVal();
  });

  document.getElementById('calPrev').addEventListener('click', function(e){
    e.stopPropagation(); view.setMonth(view.getMonth()-1); draw();
  });
  document.getElementById('calNext').addEventListener('click', function(e){
    e.stopPropagation(); view.setMonth(view.getMonth()+1); draw();
  });

  seg.addEventListener('click', function(e){
    if(pop.contains(e.target)) return;
    closeAll(pop); pop.classList.toggle('open'); draw();
  });

  draw(); updateVal();
})();

/* close any open search popover except the one passed in */
function closeAll(except){
  ['popDates','popGuests','popDest'].forEach(function(id){
    var el = document.getElementById(id);
    if(el !== except) el.classList.remove('open');
  });
}
document.addEventListener('click', function(e){
  ['segDates','segGuests','segDest'].forEach(function(id){
    var seg = document.getElementById(id);
    if(!seg.contains(e.target)) seg.querySelector('.pop').classList.remove('open');
  });
});

/* search → go to the property */
// a known location → results page; anything else (a hotel name) → the PDP
function goFromSearch(){
  var q = (document.getElementById('hotelInput').value||'').trim(), ql = q.toLowerCase();
  var LOCS = ['Goa','Udaipur','Mumbai','Andaman'], match = null;
  for(var i=0;i<LOCS.length;i++){ if(LOCS[i].toLowerCase()===ql){ match = LOCS[i]; break; } }
  if(!q) return;
  if(match){ window.location.href = 'results.html?where='+encodeURIComponent(match); return; }
  // a known hotel name → its PDP; gibberish / anything unknown → the "no properties" results screen
  window.location.href = /taj|exotica/.test(ql) ? 'hotel-firstfold.html' : ('results.html?where='+encodeURIComponent(q));
}
document.getElementById('searchGo').addEventListener('click', goFromSearch);

/* =============================================================
   HOTEL SEARCH — typeable field with suggestions
   ============================================================= */
(function(){
  var seg   = document.getElementById('segDest');
  var input = document.getElementById('hotelInput');
  var pop   = document.getElementById('popDest');
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var ICON = '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M15 21V9h3a1 1 0 0 1 1 1v11M8 8h2M8 12h2M8 16h2"/></svg>';
  var HOTELS = [
    {name:'Taj Exotica Resort & Spa',  place:'Benaulim Beach · Goa, India'},
    {name:'W Goa',                     place:'Vagator Beach · Goa, India'},
    {name:'The Westin Goa',            place:'Anjuna · Goa, India'},
    {name:'Courtyard by Marriott Goa', place:'Calangute · Goa, India'}
  ];

  function render(q){
    var ql = (q||'').trim().toLowerCase();
    var list = HOTELS.filter(function(h){ return !ql || h.name.toLowerCase().indexOf(ql)>=0 || h.place.toLowerCase().indexOf(ql)>=0; });
    if(!list.length){ pop.innerHTML = '<div class="pop-empty">No matches — try another name</div>'; return; }
    pop.innerHTML = list.map(function(h){
      return '<div class="sug" data-name="'+esc(h.name)+'">'
        + '<span class="sug-ic">'+ICON+'</span>'
        + '<div class="sug-t"><div class="sug-n">'+esc(h.name)+'</div><div class="sug-s">'+esc(h.place)+'</div></div>'
        + '</div>';
    }).join('');
    pop.querySelectorAll('.sug').forEach(function(el){
      el.addEventListener('click', function(){ input.value = el.dataset.name; pop.classList.remove('open'); });
    });
  }
  function open(){ closeAll(pop); render(input.value); pop.classList.add('open'); }

  input.addEventListener('focus', open);
  input.addEventListener('click', function(e){ e.stopPropagation(); open(); });
  input.addEventListener('input', function(){ render(input.value); pop.classList.add('open'); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ pop.classList.remove('open'); input.blur(); goFromSearch(); }
  });
  // clicking the segment's padding/label focuses the field
  seg.addEventListener('click', function(e){ if(e.target === seg || e.target.classList.contains('lb')){ input.focus(); } });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });
})();

</script>
