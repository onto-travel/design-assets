<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto · Help centre</title>
<style>
  :root{
    --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#6d726c; --line:#e4dfd2;
    --jade:#0f8a63; --jade-deep:#063f2f; --gold:#f2c14e; --pill:#f1ede3;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 44px rgba(40,30,10,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  [hidden]{display:none !important;}

  /* top nav — shared */
  .topnav{position:sticky;top:0;z-index:80;background:rgba(250,247,241,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topnav-in{max-width:1180px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:26px;}
  .tn-brand{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em;}
  .tn-brand span{color:var(--gold);}
  .tn-links{display:flex;align-items:center;gap:2px;}
  .tn-links a{font-size:14.5px;color:#5b5650;text-decoration:none;padding:8px 14px;border-radius:9px;transition:background .15s,color .15s;}
  .tn-links a:hover{background:rgba(255,255,255,.62);color:var(--ink);}
  .tn-right{margin-left:auto;display:flex;align-items:center;gap:9px;position:relative;}
  .tn-profile{height:40px;border-radius:22px;border:1px solid #d9d1c1;background:#fff;display:flex;align-items:center;
    gap:9px;padding:0 6px 0 12px;cursor:pointer;transition:border-color .15s,background .15s;}
  .tn-profile:hover{border-color:#c2b8a4;background:#faf7f1;}
  .tn-profile .burger{display:flex;flex-direction:column;gap:3px;}
  .tn-profile .burger i{display:block;width:15px;height:1.7px;background:#8a857d;border-radius:2px;}
  .tn-avatar{width:34px;height:34px;border:none;padding:0;border-radius:50%;background:var(--jade);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-family:Georgia,serif;line-height:1;text-decoration:none;cursor:pointer;transition:box-shadow .12s;}
  .tn-avatar:hover{box-shadow:0 0 0 3px rgba(15,138,99,.15);}
  .menu{position:absolute;top:calc(100% + 8px);right:0;width:250px;background:#fff;border:1px solid var(--line);
    border-radius:14px;box-shadow:0 14px 40px rgba(40,30,10,.2);padding:8px;opacity:0;transform:translateY(-6px);
    pointer-events:none;transition:opacity .15s,transform .15s;}
  .menu.open{opacity:1;transform:none;pointer-events:auto;}
  .menu-id{display:flex;align-items:center;gap:11px;padding:11px 12px 13px;border-bottom:1px solid var(--line);margin-bottom:6px;
    text-decoration:none;color:inherit;cursor:pointer;border-radius:10px 10px 0 0;transition:background .15s;}
  .menu-id:hover{background:#faf7f1;}
  .menu-id-ar{margin-left:auto;color:#b8b0a2;font-size:17px;}
  .menu-id .tn-avatar{width:38px;height:38px;font-size:20px;}
  .menu-id b{font-size:14.5px;display:block;}
  .menu-id small{font-size:12.5px;color:var(--muted);}
  .menu .item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;font-size:14px;color:var(--ink);
    text-decoration:none;cursor:pointer;}
  .menu .item:hover{background:#faf7f1;}
  .menu .item.active{color:var(--jade);font-weight:600;}
  .menu .item svg{width:19px;height:19px;stroke:#6b655c;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .menu .item.active svg{stroke:var(--jade);}
  .menu .item .ar{margin-left:auto;color:#b8b0a2;}

  /* page */
  .page{max-width:520px;margin:0 auto;padding:36px 28px 72px;}
  .h1{font-family:Georgia,serif;font-size:36px;letter-spacing:-.015em;margin:0 0 24px;}

  .lines{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:4px 26px;}
  .line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 2px;text-decoration:none;color:inherit;}
  .line+.line{border-top:1px solid #f1ede5;}
  .ln-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .ln-num{font-family:Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
    font-variant-numeric:tabular-nums;transition:color .15s;}
  .line:hover .ln-num{color:var(--jade);}

  .wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;
    background:#1fa855;color:#fff;text-decoration:none;border-radius:14px;padding:13px 20px;
    font-size:14.5px;font-weight:600;box-shadow:var(--shadow);transition:background .15s;}
  .wa-btn:hover{background:#178a46;}
  .wa-btn svg{width:22px;height:22px;fill:currentColor;}

  @media(max-width:640px){ .tn-links{display:none;} }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="tn-brand" href="home2.html">onto<span>.</span></a>
      <div class="tn-links">
        <a href="home2.html">Stays</a>
        <a href="bookings.html">Bookings</a>
      </div>
      <div class="tn-right">
        <button type="button" class="tn-avatar" id="profileBtn" aria-haspopup="true" aria-expanded="false">Y</button>
        <div class="menu" id="profileMenu" role="menu">
          <a class="menu-id" href="profile.html">
            <span class="tn-avatar" id="menuAvatar">Y</span>
            <div><b id="menuName">Saanvi</b><small>xyz@email.com</small></div>
            <span class="menu-id-ar">›</span>
          </a>
          <div class="menu-sec">
            <a class="item" href="companions.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><path d="M16 6.5a3 3 0 0 1 0 5.4M17 14.4c1.9.6 3.2 2 3.7 4.1"/></svg> Companions <span class="ar">›</span></a>
            <a class="item active" href="help.html"><svg viewBox="0 0 24 24"><path d="M12 3v0M12 8v8"/><circle cx="12" cy="12" r="9"/></svg> Help centre <span class="ar">›</span></a>
            <a class="item" href="home-loggedout.html"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Sign out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="page">
    <h1 class="h1">Help centre</h1>

    <div class="lines">
      <a class="line" href="tel:+918326681200">
        <span class="ln-label">Reservations</span>
        <span class="ln-num">+91 832 668 1200</span>
      </a>
      <a class="line" href="tel:18002008425">
        <span class="ln-label">24/7 Support</span>
        <span class="ln-num">1800 200 8425</span>
      </a>
    </div>

    <a class="wa-btn" href="https://wa.me/918326681200?text=Hi%20onto%20team%2C%20I%20need%20help%20with%20my%20booking." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3 .95.96-2.92-.2-.3A8.2 8.2 0 1 1 12 20.2z"/><path d="M17.5 14.4c-.3-.15-1.8-.9-2.05-1-.28-.1-.48-.15-.68.15s-.78.98-.95 1.18-.35.22-.65.07a8.2 8.2 0 0 1-2.4-1.48 9 9 0 0 1-1.67-2.07c-.17-.3 0-.46.13-.6.13-.14.3-.35.44-.53.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.63-.93-2.23-.24-.58-.5-.5-.68-.51h-.58c-.2 0-.52.07-.8.37s-1.05 1.03-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.25 5.15 4.56.72.3 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.08 1.8-.73 2.05-1.44.25-.7.25-1.3.18-1.44-.07-.13-.27-.2-.57-.35z"/></svg>
      Chat on WhatsApp
    </a>
  </div>

<script>
  (function(){
    const $ = id => document.getElementById(id);
    /* profile menu */
    const btn=$('profileBtn'), menu=$('profileMenu');
    btn.addEventListener('click', e => { e.stopPropagation(); const o=menu.classList.toggle('open'); btn.setAttribute('aria-expanded',o?'true':'false'); });
    document.addEventListener('click', e => { if(!menu.contains(e.target)&&!btn.contains(e.target)){ menu.classList.remove('open'); btn.setAttribute('aria-expanded','false'); } });
    /* identity from the Companions "Myself" record */
    try{
      const a = JSON.parse(localStorage.getItem('onto:travellers:v3')) || [];
      const me = a.find(t => t.relation==='Myself' || t.id==='t-you');
      const nm = (me && me.name && me.name.toLowerCase()!=='you' && !me.name.includes('@')) ? me.name : 'Saanvi';
      const ini = (nm[0]||'S').toUpperCase();
      $('profileBtn').textContent = ini;
      $('menuAvatar').textContent = ini;
      var mn=$('menuName'); if(mn) mn.textContent = nm;
    }catch(e){}
  })();
</script>
</body>
</html>
