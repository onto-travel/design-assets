<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto · Tracked booking</title>
<style>
  :root{
    --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#6d726c; --line:#e4dfd2;
    --jade:#0f8a63; --jade-deep:#063f2f; --jade-soft:#e7f3ec; --gold:#f2c14e;
    --amber:#a2610a; --amber-soft:#fdf3e2; --amber-line:#e8cf9f;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px;}

  .topnav{position:sticky;top:0;z-index:80;background:rgba(250,247,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topnav-in{max-width:760px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:20px;}
  .tn-brand{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em;}
  .tn-brand span{color:var(--gold);}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#5b5650;text-decoration:none;padding:8px 12px;border-radius:9px;}
  .back:hover{background:rgba(255,255,255,.7);color:var(--ink);}
  .back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .page{max-width:760px;margin:0 auto;padding:30px 28px 72px;}

  .hd-loc{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .hd h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.015em;margin:0 0 12px;}
  .src{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:5px 13px 5px 11px;font-size:13px;font-weight:700;
    background:#fff;border:1px solid #d7d0c2;color:#5b5650;}
  .src svg{width:13px;height:13px;stroke:#8a857d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* the ownership statement, stated plainly and early */
  .own{margin:16px 0 26px;padding:14px 16px;background:#f4f1e9;border:1px solid var(--line);border-radius:12px;
    font-size:14px;color:#4b463f;}
  .own b{color:var(--ink);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(40,30,10,.04);margin-bottom:20px;}
  .card-h{padding:15px 20px;border-bottom:1px solid var(--line);background:#fbf9f5;
    font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a09889;}

  /* status */
  .stat{padding:20px;}
  .stat-t{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
  .stat-t svg{width:18px;height:18px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .stat-t.good{color:var(--jade-deep);} .stat-t.good svg{stroke:var(--jade);}
  .stat-t.amber{color:#5c3a06;}
  .stat-p{font-size:14.5px;color:var(--muted);margin:0;}
  .stat-act{margin-top:15px;}

  /* parsed fields, exactly as we hold them */
  .dl{display:grid;grid-template-columns:170px 1fr;}
  .dl dt,.dl dd{padding:12px 20px;border-bottom:1px solid #efebe1;margin:0;font-size:14.5px;}
  .dl dt{color:var(--muted);}
  .dl dd{font-weight:600;}
  .dl dt:last-of-type,.dl dd:last-of-type{border-bottom:none;}

  /* price line since tracking began */
  .spark{padding:20px;}
  .spark-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .spark-now{font-size:24px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
  .spark-lbl{font-size:13px;color:var(--muted);}
  .spark svg{width:100%;height:110px;display:block;overflow:visible;}
  .spark .axis{stroke:#e4dfd2;stroke-width:1;}
  .spark .paid{stroke:#c4bcaa;stroke-width:1.5;stroke-dasharray:4 4;}
  .spark .line{fill:none;stroke:var(--jade);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
  .spark .dot{fill:var(--jade);}
  .spark-key{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:12.5px;color:var(--muted);}
  .spark-key i{display:inline-block;width:16px;height:0;border-top:2px solid var(--jade);vertical-align:middle;margin-right:7px;}
  .spark-key .p i{border-top:1.5px dashed #b3aa96;}
  .spark-empty{padding:20px;font-size:14.5px;color:var(--muted);}

  /* exits */
  .exits{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .exit{display:flex;align-items:center;gap:14px;padding:17px 20px;background:var(--card);text-decoration:none;
    font-family:inherit;font-size:15px;text-align:left;border:none;width:100%;cursor:pointer;color:var(--ink);}
  .exit:hover{background:#fdfcf9;}
  .exit svg{width:19px;height:19px;stroke:#6b655c;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .exit b{display:block;font-size:15px;font-weight:600;}
  .exit small{display:block;font-size:13px;color:var(--muted);font-weight:400;}
  .exit .ar{margin-left:auto;color:#b8b0a2;flex:none;}

  .btn{border:1px solid #d9d1c1;background:#fff;color:var(--ink);border-radius:11px;padding:11px 19px;
    font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;
    align-items:center;gap:8px;transition:background .15s,border-color .15s;}
  .btn:hover{background:#faf7f1;border-color:#c2b8a4;}
  .btn.jade{background:var(--jade);border-color:var(--jade);color:#fff;}
  .btn.jade:hover{background:var(--jade-deep);border-color:var(--jade-deep);}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:#fff;}
  .btn.amber:hover{background:#824d06;border-color:#824d06;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

  .confirm{padding:18px 20px;background:var(--amber-soft);border-top:1px solid var(--amber-line);}
  .confirm p{margin:0 0 13px;font-size:14.5px;color:#6d4d17;}
  .confirm .row{display:flex;gap:10px;flex-wrap:wrap;}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:640px){
    .page{padding:22px 16px 64px;}
    .topnav-in{padding:0 16px;}
    .hd h1{font-size:25px;}
    .dl{grid-template-columns:1fr;}
    .dl dt{padding:12px 18px 0;border-bottom:none;font-size:13px;}
    .dl dd{padding:2px 18px 12px;}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="tn-brand" href="home2.html">onto<span>.</span></a>
      <a class="back" href="bookings.html">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Bookings</a>
    </div>
  </nav>

  <div class="page" id="page"></div>

<script src="tracking-data.js"></script>
<script>
(function(){
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var T = window.Tracking, fmt = T.fmt;
  var id = new URLSearchParams(location.search).get('id') || 'bk-taj-exotica';
  var b = T.get(id);

  var ICON = {
    ext:  '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    tick: '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.3 8.3 0 0 1 3.5 11.5a8.5 8.5 0 1 1 17.5 0z"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
  };

  if(!b || b.ownership !== 'tracked'){
    document.getElementById('page').innerHTML =
      '<div class="hd"><h1>Not a tracked booking</h1></div>' +
      '<p style="color:#6d726c">Open it from <a href="bookings.html">your bookings</a>.</p>';
    return;
  }

  var c = b.comparison;

  /* ---------- status ---------- */
  function statusBlock(){
    var t = '', p = '', act = '', cls = '';

    switch(b.status){
      case 'saving_available':
        if(c && c.isSaving){
          cls = 'good'; t = ICON.tick + 'Save ' + fmt.inr(c.delta) + ' with us';
          p = 'Same room, same meal plan, same free cancellation. Both totals include taxes and fees.';
          act = '<a class="btn jade" href="booking-switch.html?id=' + esc(b.id) + '">Compare and switch</a>';
        } else if(c){
          /* Cheaper but worse on an attribute — not offered, not quantified. */
          cls = 'good'; t = ICON.tick + 'Still your best rate';
          p = 'We have nothing below what you paid for the same room and meal plan.';
        }
        break;
      case 'no_saving_up':
        cls = 'good'; t = ICON.tick + 'Still your best rate';
        p = 'Our price is up ' + fmt.inr(b.rose_by) + ' since ' + fmt.day(b.rose_since) +
            '.';
        break;
      case 'no_saving_flat':
        cls = 'good'; t = ICON.tick + 'Still your best rate';
        p = 'Our price has not moved since you booked.';
        break;
      case 'sold_out':
        t = 'Sold out for your dates';
        p = 'We have no rooms at this property for ' + fmt.dateRange(b.check_in, b.check_out) +
            '. We’ll keep checking daily and message you if that changes.';
        break;
      case 'not_carried':
        t = 'Not on onto';
        p = 'We don’t have this property, so we can’t watch its price. We’ve kept the booking here for your records.';
        act = '<a class="btn" href="' + esc(T.WA.forward()) + '" target="_blank" rel="noopener">' +
              ICON.chat + 'Forward another booking</a>';
        break;
      case 'pending':
        t = 'Checking your booking';
        p = 'We’re reading what you forwarded and matching it to a property. We’ll confirm shortly and start watching the price.';
        break;
      case 'cancel_pending':
        var se = b.switch_event, held = b.price_paid_total - se.booked_price, cd = fmt.countdown(se.cancel_deadline);
        cls = 'amber'; t = fmt.inr(held) + ' saved — cancel this one to keep it';
        p = 'You booked ' + b.property_name_raw + ' with us. This ' + b.platform.label +
            ' booking is still live and is yours to cancel — free until ' + fmt.deadline(se.cancel_deadline) +
            ', ' + cd.text + '.';
        act = '<a class="btn" href="' + esc(b.platform.manage) + '" target="_blank" rel="noopener">' +
                ICON.ext + 'Open ' + esc(b.platform.label) + '</a> ' +
              '<button type="button" class="btn amber" id="didCancel">I’ve cancelled this</button>';
        break;
      case 'switched_cancelled':
        var sev = b.switch_event, saved = b.price_paid_total - sev.booked_price;
        cls = 'good'; t = ICON.tick + 'Saved ' + fmt.inr(saved);
        p = 'You switched this stay to us and cancelled on ' + b.platform.label + '.';
        act = '<a class="btn" href="booking-details.html" data-owned="' +
                esc(sev.new_booking_id) + '">View voucher</a>';
        break;
    }

    return '<section class="card"><div class="card-h">Status</div>' +
      '<div class="stat">' +
        '<h2 class="stat-t ' + cls + '">' + t + '</h2>' +
        '<p class="stat-p">' + esc(p) + '</p>' +
        (act ? '<div class="stat-act">' + act + '</div>' : '') +
      '</div></section>';
  }

  /* ---------- the booking, exactly as we hold it ---------- */
  function parsedBlock(){
    var rows = [
      ['Property', b.property_name_raw],
      ['Booked on', b.platform.label],
      ['Dates', fmt.dateRange(b.check_in, b.check_out) + ' · ' + b.nights],
      ['Room', b.room_category],
      ['Occupancy', b.occupancy],
      ['Meal plan', b.meal_plan || 'Not stated on your confirmation'],
      ['Cancellation', T.cancellationText(b.cancellation_policy, b.free_cancellation_until) +
        (b.free_cancellation_until ? ', ' + fmt.deadline(b.free_cancellation_until) : '')],
      ['Total paid', fmt.inr(b.price_paid_total) + ' — includes taxes and fees'],
      ['Tracking since', fmt.dayYear(b.created_at)]
    ];
    return '<section class="card"><div class="card-h">What we hold</div><dl class="dl">' +
      rows.map(function(r){
        return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
      }).join('') +
    '</dl></section>';
  }

  /* ---------- price line since tracking began ---------- */
  function sparkBlock(){
    var obs = (b.observations || []).filter(function(o){ return o[1] !== null; });
    if(obs.length < 2){
      return '<section class="card"><div class="card-h">Our price since tracking began</div>' +
        '<div class="spark-empty">' +
          (b.status === 'pending'
            ? 'We start recording our price once your booking is confirmed.'
            : b.status === 'not_carried'
              ? 'We don’t carry this property, so there is no price to record.'
              : 'Not enough readings yet. We check daily.') +
        '</div></section>';
    }

    var W = 640, H = 110, PAD = 6;
    var vals = obs.map(function(o){ return o[1]; }).concat([b.price_paid_total]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(hi === lo){ hi = lo + 1; }
    var x = function(i){ return PAD + i * ((W - PAD * 2) / (obs.length - 1)); };
    var y = function(v){ return PAD + (hi - v) / (hi - lo) * (H - PAD * 2); };

    var pts = obs.map(function(o, i){ return x(i) + ',' + y(o[1]); }).join(' ');
    var dots = obs.map(function(o, i){ return '<circle class="dot" cx="' + x(i) + '" cy="' + y(o[1]) + '" r="2.6"/>'; }).join('');
    var paidY = y(b.price_paid_total);
    var last = obs[obs.length - 1][1];
    var soldOutTail = (b.observations || []).some(function(o){ return o[1] === null; });

    return '<section class="card"><div class="card-h">Our price since tracking began</div>' +
      '<div class="spark">' +
        '<div class="spark-top">' +
          '<div><div class="spark-now">' + fmt.inr(last) + '</div>' +
            '<div class="spark-lbl">' + (soldOutTail ? 'Last price before it sold out' : 'Our price today') + '</div></div>' +
          '<div class="spark-lbl">' + esc(fmt.day(obs[0][0])) + ' – ' + esc(fmt.day(obs[obs.length - 1][0])) + '</div>' +
        '</div>' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
          'aria-label="Our price moved from ' + fmt.inr(obs[0][1]) + ' to ' + fmt.inr(last) + '">' +
          '<line class="paid" x1="0" y1="' + paidY + '" x2="' + W + '" y2="' + paidY + '"/>' +
          '<polyline class="line" points="' + pts + '"/>' + dots +
        '</svg>' +
        '<div class="spark-key">' +
          '<span><i></i>Our price</span>' +
          '<span class="p"><i></i>What you paid on ' + esc(b.platform.label) + ' — ' + fmt.inr(b.price_paid_total) + '</span>' +
        '</div>' +
      '</div></section>';
  }

  /* ---------- exits ---------- */
  function exitsBlock(){
    return '<section class="exits">' +
      '<a class="exit" href="' + esc(T.WA.fix(b)) + '" target="_blank" rel="noopener">' + ICON.chat +
        '<span><b>Something wrong here?</b><small>Message us on WhatsApp and a person will fix it</small></span>' +
        '<span class="ar">›</span></a>' +
      '<button type="button" class="exit" id="stopBtn">' + ICON.stop +
        '<span><b>No longer have this booking?</b><small>We’ll stop watching its price</small></span>' +
        '<span class="ar">›</span></button>' +
      '<div id="stopConfirm"></div>' +
    '</section>';
  }

  document.getElementById('page').innerHTML =
    '<div class="hd">' +
      '<div class="hd-loc">' + esc(b.location) + '</div>' +
      '<h1>' + esc(b.property_name_raw) + '</h1>' +
      '<span class="src">' + ICON.ext + 'On ' + esc(b.platform.label) + '</span>' +
    '</div>' +
    '<p class="own">You booked this on <b>' + esc(b.platform.label) + '</b>, not with us. ' +
      'We watch the price and tell you if we can beat it. ' +
      '<b>We can’t change or cancel it</b> — that stays with ' + esc(b.platform.label) + '.</p>' +
    statusBlock() + parsedBlock() + sparkBlock() + exitsBlock();

  var didCancel = document.getElementById('didCancel');
  if(didCancel){
    didCancel.addEventListener('click', function(){
      T.markCancelled(b.id);   /* user's word alone — no proof, no verification */
      location.reload();
    });
  }

  /* hand the owned booking to the existing voucher page */
  document.addEventListener('click', function(e){
    var own = e.target.closest('[data-owned]');
    if(own) T.openOwned(own.getAttribute('data-owned'));
  });

  document.getElementById('stopBtn').addEventListener('click', function(){
    var host = document.getElementById('stopConfirm');
    if(host.innerHTML){ host.innerHTML = ''; return; }
    host.innerHTML =
      '<div class="confirm">' +
        '<p>We’ll stop watching ' + esc(b.property_name_raw) + ' and it will leave your bookings list. ' +
          'Your booking on ' + esc(b.platform.label) + ' is not affected.</p>' +
        '<div class="row">' +
          '<button type="button" class="btn amber" id="stopGo">Stop tracking</button>' +
          '<button type="button" class="btn" id="stopNo">Keep tracking</button>' +
        '</div>' +
      '</div>';
    document.getElementById('stopNo').addEventListener('click', function(){ host.innerHTML = ''; });
    document.getElementById('stopGo').addEventListener('click', function(){
      T.stopTracking(b.id);
      location.href = 'bookings.html';
    });
  });
})();
</script>
</body>
</html>
