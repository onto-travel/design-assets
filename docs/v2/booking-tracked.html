<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto · Tracked booking</title>
<style>
  :root{
    --bg:#faf8f3; --card:#ffffff; --ink:#1b211e; --muted:#6d726c; --line:#e4dfd2;
    --jade:#0f8a63; --jade-deep:#063f2f; --jade-soft:#e7f3ec; --gold:#f2c14e; --green:#0f8a63;
    --amber:#a2610a; --amber-soft:#fdf3e2; --amber-line:#e8cf9f;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 44px rgba(40,30,10,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px;}
  [hidden]{display:none !important;}
  .pagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0;}

  .topnav{position:sticky;top:0;z-index:80;background:rgba(250,247,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topnav-in{max-width:1180px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:20px;}
  .tn-brand{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em;}
  .tn-brand span{color:var(--gold);}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#5b5650;text-decoration:none;padding:8px 12px;border-radius:9px;}
  .back:hover{background:rgba(255,255,255,.7);color:var(--ink);}
  .back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ===== two columns: what we're telling them, beside the stay itself ===== */
  .layout{display:flex;gap:24px;align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%;}
  .rightcol{order:2;width:520px;max-width:100%;display:flex;}
  .rightcol > .card{width:100%;flex:1;}
  .stay-card{order:1;width:480px;max-width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:20px 20px 22px;display:flex;flex-direction:column;}

  .card{width:520px;max-width:100%;background:#faf8f3;border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px 30px 32px;position:relative;}
  .backlink{position:absolute;top:16px;left:16px;z-index:3;display:inline-flex;align-items:center;gap:5px;
    color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;padding:6px 8px;border-radius:8px;
    transition:color .15s,background .15s;}
  .backlink:hover{color:var(--jade);background:#faf8f3;}
  .backlink svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .head{text-align:center;padding:26px 0 0;}
  .head h1{font-family:Georgia,serif;font-size:32px;line-height:1.1;color:#063f2f;margin:0 0 12px;letter-spacing:-.015em;}
  .head h1.amber{color:#5c3a06;}
  .head p{color:var(--muted);font-size:15.5px;margin:0 auto;max-width:400px;}
  .head p b{color:#063f2f;font-weight:700;}
  /* the live price no longer matches the alert that sent them here */
  .drift{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;font-size:12px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;color:var(--amber);}
  .drift svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* the two totals, stacked — what they paid, then what the same stay is with
     us. One box so they read as one comparison rather than two facts. */
  .paybox{margin-top:24px;border-radius:14px;overflow:hidden;background:#fff;text-align:left;
    box-shadow:0 1px 3px rgba(40,30,10,.06), 0 10px 24px -14px rgba(40,30,10,.22);}
  .paid{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;}
  .paid .pl{display:inline-flex;align-items:center;gap:9px;font-size:15px;color:#3a6a4d;font-weight:600;}
  .paid .pl svg{width:17px;height:17px;stroke:var(--green);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .pl-tx{display:flex;flex-direction:column;}
  .paid .amt{font-family:Georgia,serif;font-size:23px;font-weight:600;color:#20321f;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;}
  .paybox .paid + .paid{border-top:1px solid #efe8da;}
  .paid.neutral .pl{color:var(--muted);}
  .paid.neutral .pl svg{stroke:var(--muted);}
  .paid.neutral .amt{color:var(--ink);}
  /* the one they no longer have to pay */
  .paid.was .amt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;}

  .actions{margin-top:24px;display:flex;flex-direction:column;gap:12px;}
  .btnrow{display:flex;gap:12px;}
  .btn{flex:1;border:none;background:var(--jade);color:#fff;font-size:15px;font-weight:600;
    padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s;}
  .btn:hover{background:var(--jade-deep);}
  .btn.amber{background:var(--amber);} .btn.amber:hover{background:#824d06;}
  .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ghostbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;
    border:1px solid #e2dac9;border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:600;
    color:var(--jade);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;}
  .ghostbtn:hover{background:#faf8f3;border-color:#d3c9b4;}
  .ghostbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .textbtn{display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:none;
    padding:6px;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    cursor:pointer;text-decoration:none;transition:color .15s;}
  .textbtn:hover{color:var(--ink);text-decoration:underline;}

  /* ===== the CTA that becomes the confirmation =====
     One box the whole way through: it carries the button's fill while it is a
     button, then grows into the panel in place. A second box appearing below
     would read as a new thing to deal with rather than the same decision
     opening up. */
  .morph{position:relative;border:1px solid transparent;border-radius:12px;background:var(--jade);
    overflow:hidden;transition:height .32s cubic-bezier(.4,0,.2,1),background-color .32s,border-color .32s;}
  /* a button shrink-wraps its content even as a block-level flex box; these
     were only full width before because the .actions column stretched them */
  .morph > .btn{width:100%;border-radius:11px;}
  .morph > .textbtn{width:100%;}
  .morph.open{background:var(--jade-soft);border-color:#c7e3d5;}
  /* the tertiary control has no fill of its own to carry, so its box starts
     invisible and only becomes one when it opens */
  .morph.stop{background:none;}
  .morph.stop.open{background:var(--amber-soft);border-color:var(--amber-line);}
  .morph-in{padding:16px 18px;text-align:left;opacity:0;transition:opacity .2s ease .06s;}
  .morph-in.in{opacity:1;}
  .morph-in p{margin:0 0 13px;font-size:14px;color:#2c5445;}
  .morph-in p b{color:var(--jade-deep);font-weight:700;}
  .morph-in.amber p{color:#6d4d17;}
  .morph-in.amber p b{color:#5c3a06;}
  .morph-in .row{display:flex;gap:10px;}

  /* ===== the stay itself (ported from the confirmation summary) ===== */
  .sum-hero{position:relative;border-radius:16px;overflow:hidden;height:248px;box-shadow:var(--shadow);}
  .sum-hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .sum-hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(20,16,26,.92) 0%,rgba(20,16,26,.55) 42%,rgba(20,16,26,.40) 72%,rgba(20,16,26,.52) 100%);}
  .hero-out{position:absolute;top:14px;right:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;
    border-radius:20px;padding:7px 13px 7px 11px;border:1px solid rgba(255,255,255,.28);
    background:rgba(20,16,26,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#fff;font-size:12.5px;font-weight:600;text-decoration:none;transition:background .15s;
    max-width:calc(100% - 28px);white-space:nowrap;}
  .hero-out:hover{background:rgba(20,16,26,.62);}
  .hero-out svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .sum-hero-tx{position:absolute;left:20px;right:18px;bottom:16px;z-index:2;color:#fff;}
  .sum-hero-tx .stars{color:#f0c66a;letter-spacing:3px;font-size:14px;line-height:1;margin-bottom:6px;}
  .sum-hero-tx h1{font-family:Georgia,serif;font-size:27px;line-height:1.08;margin:0 0 6px;color:#fff;letter-spacing:-.01em;}
  .sum-hero-tx .place{color:rgba(255,255,255,.86);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;}
  .stay-sum{margin-top:16px;}
  .sum-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;}
  .sum-top .sh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .sum-row{display:flex;gap:12px;align-items:center;padding:9px 2px;}
  .sum-row+.sum-row{border-top:1px solid #f1ede5;}
  .sum-ic{flex:none;width:34px;height:34px;border-radius:10px;background:#f1ede3;color:#b3893f;
    display:flex;align-items:center;justify-content:center;}
  .sum-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sum-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .sum-k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .sum-v{min-width:0;font-size:14.5px;color:var(--ink);font-weight:600;text-align:left;}
  .sum-v span{display:inline;font-weight:400;color:var(--muted);}
  .sum-v span::before{content:" · ";}
  /* when it entered tracking — a record fact, so it rides the section label rather than the stay rows */
  .since{font-size:12px;color:var(--muted);}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:920px){ .layout{flex-direction:column;align-items:center;} .rightcol{order:0;} .stay-card{order:1;} }
  @media(max-width:640px){
    .pagewrap{padding:22px 14px 48px;}
    .topnav-in{padding:0 16px;}
    .card{padding:36px 20px 26px;}
    .head h1{font-size:26px;}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="tn-brand" href="home2.html">onto<span>.</span></a>
      <a class="back" href="bookings.html">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Bookings</a>
    </div>
  </nav>

  <div class="pagewrap"><div class="layout" id="page"></div></div>

<script src="tracking-data.js"></script>
<script>
(function(){
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var T = window.Tracking, fmt = T.fmt;
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || 'bk-taj-exotica';
  /* 'reduced' | 'gone' | 'unavailable' — set by the alert link when the live
     price no longer matches what we messaged. */
  var changed = qs.get('changed');
  var b = T.get(id);

  var ICON = {
    ext:  '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    tick: '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.3 8.3 0 0 1 3.5 11.5a8.5 8.5 0 1 1 17.5 0z"/></svg>',
    alert:'<svg viewBox="0 0 24 24"><path d="M12 8v5M12 17v0M10.3 3.9L2.4 18a1.8 1.8 0 0 0 1.6 2.7h16a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.9 1.9 0 0 0-3.4 0z"/></svg>',
    cin:  '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 2.5v4M16 2.5v4"/></svg>',
    cout: '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 2.5v4M16 2.5v4"/><path d="M9 14.5l2 2 3.5-3.5"/></svg>',
    bed:  '<svg viewBox="0 0 24 24"><path d="M3 18v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4"/><path d="M3 18v2.5M21 18v2.5"/><path d="M3 15h18"/><path d="M6.5 12V9.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2V12"/></svg>',
    gst:  '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.1"/><path d="M3.5 20c.6-3.1 3-4.8 5.5-4.8s4.9 1.7 5.5 4.8"/><path d="M16.2 5.3a3 3 0 0 1 0 5.6M21 20c-.4-2.1-1.7-3.5-3.4-4.2"/></svg>',
    umb:  '<svg viewBox="0 0 24 24"><path d="M12 3v1.5"/><path d="M3.5 12a8.5 8.5 0 0 1 17 0Z"/><path d="M12 12v6a2.4 2.4 0 0 0 4.8 0"/></svg>',
    cup:  '<svg viewBox="0 0 24 24"><path d="M4.5 8.5h12v4.5a5 5 0 0 1-5 5H9.5a5 5 0 0 1-5-5V8.5Z"/><path d="M16.5 9.5H18a2.4 2.4 0 0 1 0 4.8h-1.5"/><path d="M7.5 3.2c-.4.6-.4 1.4 0 2M11 3.2c-.4.6-.4 1.4 0 2"/></svg>'
  };

  if(!b || b.ownership !== 'tracked'){
    document.getElementById('page').innerHTML =
      '<div class="card"><div class="head"><h1>Not a tracked booking</h1>' +
      '<p>Open it from <a href="bookings.html">your bookings</a>.</p></div></div>';
    return;
  }

  /* ---------- apply the "price moved" overlay, if any ----------
     We never silently swap the number and never show the stale one: the
     alerted figure is kept so the notice can state both. */
  var alertedOurTotal = null;
  if(changed && b.our_offer){
    if(changed === 'reduced'){
      alertedOurTotal = b.our_offer.our_price_total - 1600;   // we alerted a lower price
    } else if(changed === 'gone'){
      alertedOurTotal = b.our_offer.our_price_total;
      b.our_offer.our_price_total = b.price_paid_total + 1500; // now dearer than theirs
    } else if(changed === 'unavailable'){
      alertedOurTotal = b.our_offer.our_price_total;
      b.our_offer.availability = 'sold_out';
    }
    b.comparison = T.compare(b);
  }

  var c = b.comparison;
  /* We hold the date a stay starts, never the hotel's check-in clock — that is
     on their confirmation from the platform, not on anything we parsed. */
  var wday = function(iso){ return new Date(iso).toLocaleDateString('en-GB', { weekday:'short' }); };
  var dayFull = function(iso){ return wday(iso) + ' ' + fmt.day(iso); };

  /* ---------- what we are telling them about this booking ----------
     The drift cases come first: if the live price no longer matches the alert
     that sent them here, that is the first thing they need to be told. */
  function state(){
    if(changed === 'unavailable') return {
      note: 'Changed since we messaged you',
      h: 'No longer available with us',
      p: b.room_category + ' at ' + b.property_name_raw + ' sold out with us after we sent your alert. ' +
         'Your ' + b.platform.label + ' booking is unaffected. We’ll keep checking and message you if it opens up.'
    };

    if(changed === 'gone') return {
      note: 'Changed since we messaged you',
      h: 'The saving is gone',
      p: 'Our price rose after we sent your alert — this stay is now ' +
         fmt.inr(b.our_offer.our_price_total - b.price_paid_total) + ' more with us than you paid on ' +
         b.platform.label + '. Your booking there is unaffected, and we’ll keep watching.'
    };

    switch(b.status){
      case 'saving_available':
        if(c && c.isSaving) return {
          note: changed === 'reduced' ? 'Our price rose by ' +
            fmt.inr(b.our_offer.our_price_total - alertedOurTotal) + ' after your alert went out' : '',
          h: 'We’ve got a lower price',
          morph: true,
          cta: '<button type="button" class="btn" id="bookBtn">Book with us</button>'
        };
        /* Cheaper but worse on an attribute — not offered, not quantified. */
        return { h: 'Still your best rate',
                 p: 'We have nothing below what you paid for the same room and meal plan.' };

      case 'no_saving_up':
        return { h: 'Still your best rate',
                 p: 'Our price is up ' + fmt.inr(b.rose_by) + ' since ' + fmt.day(b.rose_since) + '.' };

      case 'no_saving_flat':
        return { h: 'Still your best rate', p: 'Our price has not moved since you booked.' };

      case 'sold_out':
        return { h: 'Sold out for your dates',
                 p: 'We have no rooms at this property for ' + fmt.dateRange(b.check_in, b.check_out) +
                    '. We’ll keep checking daily and message you if that changes.' };

      case 'not_carried':
        return { h: 'Not on onto',
                 p: 'We don’t have this property, so we can’t watch its price. We’ve kept the booking here for your records.',
                 cta: '<a class="ghostbtn" href="' + esc(T.WA.forward()) + '" target="_blank" rel="noopener">' +
                        ICON.chat + 'Forward another booking</a>' };

      case 'pending':
        return { h: 'Checking your booking',
                 p: 'We’re reading what you forwarded and matching it to a property. We’ll confirm shortly and start watching the price.' };

      case 'cancel_pending':
        var se = b.switch_event, cd = fmt.countdown(se.cancel_deadline);
        return {
          amber: true,
          h: 'Cancel this one to keep the saving',
          /* The deadline is the fact; the hours are only worth saying once
             there are hours rather than days of it left. */
          p: 'You booked ' + b.property_name_raw + ' with us. This ' + b.platform.label +
             ' booking is still live, free to cancel until ' +
             fmt.deadline(se.cancel_deadline) + (cd.urgent ? ', ' + cd.text : '') + '.',
          cta: '<button type="button" class="btn amber" id="didCancel">I’ve cancelled this</button>'
        };

      case 'switched_cancelled':
        return { h: 'Switched to us',
                 p: 'You switched this stay to us and cancelled on ' + b.platform.label + '.',
                 cta: '<a class="btn" href="booking-details.html" data-owned="' +
                        esc(b.switch_event.new_booking_id) + '">View voucher</a>' };
    }
    return { h: 'Tracked booking', p: '' };
  }

  /* ---------- the totals ---------- */
  function paybox(){
    /* Their price is always the first row: it is the one that already left
       their account. Ours only joins it when there is something to compare. */
    var ours = null;
    if(c && c.isSaving) ours = c.ourTotal;
    else if(b.switch_event) ours = b.switch_event.booked_price;

    var theirs =
      '<div class="paid neutral' + (ours ? ' was' : '') + '">' +
        '<span class="pl">' + ICON.ext + '<span class="pl-tx">You paid</span></span>' +
        '<span class="amt">' + fmt.inr(b.price_paid_total) + '</span>' +
      '</div>';

    if(ours === null) return '<div class="paybox">' + theirs + '</div>';

    return '<div class="paybox">' + theirs +
      '<div class="paid">' +
        '<span class="pl">' + ICON.tick + '<span class="pl-tx">With us</span></span>' +
        '<span class="amt">' + fmt.inr(ours) + '</span>' +
      '</div></div>';
  }

  /* ---------- the stay, as we hold it ---------- */
  function stayCard(){
    var rows = [
      [ICON.cin,  'Check-in',  dayFull(b.check_in)],
      [ICON.cout, 'Check-out', dayFull(b.check_out) + '<span>' + esc(b.nights) + '</span>'],
      [ICON.bed,  'Room',      esc(b.room_category)],
      [ICON.gst,  'Guests',    esc(b.occupancy)],
      [ICON.umb,  'Cancellation', esc(T.cancellationText(b.cancellation_policy, b.free_cancellation_until))],
      [ICON.cup,  'Meal plan', esc(b.meal_plan || 'Not stated on your confirmation')]
    ];
    return '<aside class="stay-card">' +
      '<div class="sum-hero">' +
        '<img src="' + esc(b.image) + '" alt="' + esc(b.room_category) + '">' +
        /* The way out rides the photo: it belongs to the booking the card
           describes, and at this size it reads as a label rather than a
           second action competing with Book with us. */
        '<a class="hero-out" href="' + esc(b.platform.manage) + '" target="_blank" rel="noopener">' +
          ICON.ext + 'Your original booking</a>' +
        '<div class="sum-hero-tx">' +
          '<div class="stars">' + new Array((b.stars || 0) + 1).join('★') + '</div>' +
          '<h1>' + esc(b.property_name_raw) + '</h1>' +
          '<div class="place">' + esc(b.location) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="stay-sum">' +
        '<div class="sum-top"><span class="sh">Your stay</span>' +
          '<span class="since">Tracked since ' + esc(fmt.dayYear(b.created_at)) + '</span></div>' +
        rows.map(function(r){
          return '<div class="sum-row"><span class="sum-ic">' + r[0] + '</span>' +
            '<div class="sum-c"><div class="sum-k">' + r[1] + '</div>' +
            '<div class="sum-v">' + r[2] + '</div></div></div>';
        }).join('') +
      '</div>' +
    '</aside>';
  }

  var s = state();

  /* Both of the page's decisions use the same box: the control sits in it, and
     confirming replaces the control in place rather than opening a panel under
     it. Kept as strings so the reverse leg can put the control back. */
  var BOOK_BTN = '<button type="button" class="btn" id="bookBtn">Book with us</button>';
  var STOP_BTN = '<button type="button" class="textbtn" id="stopBtn">No longer have this booking?</button>';

  document.getElementById('page').innerHTML =
    '<div class="rightcol"><div class="card">' +
      '<a class="backlink" href="bookings.html">' +
        '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back to bookings</a>' +
      '<div>' +
        '<div class="head">' +
          (s.note ? '<div class="drift">' + ICON.alert + esc(s.note) + '</div>' : '') +
          '<h1' + (s.amber ? ' class="amber"' : '') + '>' + esc(s.h) + '</h1>' +
          (s.p ? '<p>' + esc(s.p) + '</p>' : '') +
        '</div>' +
        paybox() +
      '</div>' +
      '<div class="actions">' +
        (s.cta
          ? (s.morph ? '<div class="morph" id="morph">' + s.cta + '</div>'
                     : '<div class="btnrow">' + s.cta + '</div>')
          : '') +
        '<div class="morph stop" id="stopMorph">' + STOP_BTN + '</div>' +
      '</div>' +
    '</div></div>' +
    stayCard();

  /* ---------- a control that becomes its own confirmation ----------
     The box is measured at its current height, refilled, then animated to the
     new one, so the control grows into the confirmation rather than being
     joined by a panel underneath it. */
  function morphTo(el, html, wire){
    el.style.height = el.offsetHeight + 'px';
    el.innerHTML = html;
    var inner = el.firstChild;
    var to = inner.offsetHeight + 2;      /* +2 for the box's own hairline border */
    /* wired before the animation, not after it: the new buttons are live from
       the frame they appear in. */
    if(wire) wire();
    requestAnimationFrame(function(){
      el.style.height = to + 'px';
      if(inner.classList.contains('morph-in')) inner.classList.add('in');
    });
    /* transitionend can't be relied on (reduced motion drops the transition
       altogether), so the inline height is always cleared on a timer. */
    setTimeout(function(){ el.style.height = ''; }, 340);
  }

  /* ---------- book with us -> the old booking becomes a cancel task ---------- */
  var bookMorph = document.getElementById('morph');

  function wireBook(){
    document.getElementById('bookBtn').addEventListener('click', function(){
      bookMorph.classList.add('open');
      morphTo(bookMorph,
        '<div class="morph-in">' +
          '<p>Your ' + esc(b.platform.label) + ' booking is still live, free to cancel until <b>' +
            esc(fmt.deadline(b.free_cancellation_until)) + '</b>.</p>' +
          '<div class="row">' +
            '<button type="button" class="btn" id="bookGo">Pay ' + fmt.inr(c.ourTotal) + '</button>' +
            '<button type="button" class="ghostbtn" id="bookNo">Back</button>' +
          '</div>' +
        '</div>',
        function(){
          document.getElementById('bookNo').addEventListener('click', function(){
            bookMorph.classList.remove('open');
            morphTo(bookMorph, BOOK_BTN, wireBook);
          });
          document.getElementById('bookGo').addEventListener('click', function(){
            /* payment is stubbed in this prototype */
            T.completeSwitch(b.id, c.ourTotal);
            location.href = 'bookings.html';
          });
        });
    });
  }
  if(bookMorph) wireBook();

  var didCancel = document.getElementById('didCancel');
  if(didCancel){
    didCancel.addEventListener('click', function(){
      T.markCancelled(b.id);   /* user's word alone — no proof, no verification */
      location.reload();
    });
  }

  /* hand the owned booking to the existing voucher page */
  document.addEventListener('click', function(e){
    var own = e.target.closest('[data-owned]');
    if(own) T.openOwned(own.getAttribute('data-owned'));
  });

  /* ---------- stop tracking ---------- */
  var stopMorph = document.getElementById('stopMorph');

  function wireStop(){
    document.getElementById('stopBtn').addEventListener('click', function(){
      stopMorph.classList.add('open');
      morphTo(stopMorph,
        '<div class="morph-in amber">' +
          /* The only thing at stake is whether they think we can cancel it. */
          '<p>We’ll stop watching this booking. Your ' + esc(b.platform.label) + ' booking isn’t affected.</p>' +
          '<div class="row">' +
            '<button type="button" class="btn amber" id="stopGo">Stop tracking</button>' +
            '<button type="button" class="ghostbtn" id="stopNo">Keep tracking</button>' +
          '</div>' +
        '</div>',
        function(){
          document.getElementById('stopNo').addEventListener('click', function(){
            stopMorph.classList.remove('open');
            morphTo(stopMorph, STOP_BTN, wireStop);
          });
          document.getElementById('stopGo').addEventListener('click', function(){
            T.stopTracking(b.id);
            location.href = 'bookings.html';
          });
        });
    });
  }
  wireStop();
})();
</script>
<script src="topnav.js"></script>
</body>
</html>
