<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto — Add flight</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-default);color:var(--text-primary);
    font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }

  /* ---------- phone frame (same chrome as hotel-firstfold-app.html) ---------- */
  .phone{position:relative;width:390px;height:844px;background:#000;border-radius:54px;
    padding:12px;box-shadow:0 40px 90px rgba(30,22,10,.16),0 0 0 2px rgba(0,0,0,.15);flex:none;}
  .screen{position:relative;width:100%;height:100%;background:var(--bg-surface);border-radius:42px;
    overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:30px;
    background:#000;border-radius:20px;z-index:40;}

  .statusbar{flex:none;display:flex;align-items:center;
    justify-content:space-between;padding:20px 26px 6px;font-size:14px;font-weight:600;
    color:var(--text-primary);}
  .sb-right{display:flex;align-items:center;gap:6px;font-size:13px;}

  /* ---------- app header ---------- */
  .appbar{flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:4px 12px 8px;}
  .ab-btn{width:38px;height:38px;border-radius:50%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--icon-primary);
    transition:background .15s;flex:none;}
  .ab-btn:hover{background:var(--green-soft);}
  .ab-btn svg{width:20px;height:20px;stroke:var(--icon-primary);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .at-title{font-family:var(--font-body);font-size:var(--fs-xl);font-weight:var(--fw-bold);
    color:var(--text-primary);}

  /* ---------- scroll body — fields, then the matched flight, on one screen ---------- */
  .body{flex:1;overflow-y:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:var(--sp-20);}

  /* ---------- field pills ---------- */
  .field{display:flex;align-items:center;gap:var(--sp-12);background:var(--bg-surface);
    border:1.5px solid var(--border-default);border-radius:var(--r-xl);padding:0 var(--sp-16);
    height:64px;box-shadow:var(--shadow-field);position:relative;z-index:1;
    transition:border-color .15s,border-radius .15s;}
  /* the flight-number field fuses with its suggestion list, since that's a
     menu the field owns. The date field's calendar and confirm card are their
     own floating panels instead — a fused seam reads fine for a short list,
     but flattens a whole result card into looking like static page content. */
  .fn-wrap:has(.suggest-wrap.show) .field{
    border-color:var(--accent-brand-primary);border-radius:var(--r-xl) var(--r-xl) 0 0;}
  .field svg{width:20px;height:20px;stroke:var(--icon-primary);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .field-tx{display:flex;flex-direction:column;min-width:0;flex:1;}
  .field-tx em{font-style:normal;font-size:var(--fs-xs);font-weight:var(--fw-medium);
    color:var(--text-secondary);line-height:1.2;}
  .field-tx input{border:none;outline:none;background:none;font-family:inherit;width:100%;
    font-size:var(--fs-xl);font-weight:var(--fw-bold);color:var(--text-primary);padding:0;line-height:1.35;}
  .field-tx input::placeholder{color:var(--text-secondary);font-weight:var(--fw-medium);}
  .field-stack{display:flex;flex-direction:column;gap:var(--sp-12);}
  /* the date field only appears once a flight number is matched; tapping it
     opens a calendar dropdown, and picking a day there is what surfaces the
     confirm card below it */
  .dt-wrap{display:none;flex-direction:column;}
  .dt-wrap.show{display:flex;}
  .dt-wrap .field{cursor:pointer;}
  .field-chevron{width:16px;height:16px;stroke:var(--icon-secondary);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .actions{display:flex;flex-direction:column;gap:var(--sp-8);}

  /* ---------- upload ticket — tertiary: text only, no container ---------- */
  .cta-upload{display:flex;align-items:center;justify-content:center;gap:var(--sp-8);
    width:100%;border:none;background:none;color:var(--text-secondary);
    padding:2px;font-family:inherit;font-size:var(--fs-l);
    font-weight:var(--fw-bold);cursor:pointer;transition:color .15s;}
  .cta-upload:hover{color:var(--text-primary);}
  .cta-upload:disabled{cursor:default;}
  .cta-upload svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .btn-spin{width:15px;height:15px;border:2px solid var(--border-default);
    border-top-color:var(--text-secondary);border-radius:50%;animation:spin .7s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- matched flight card — floats below the date field as its own
     panel (not fused to it), so it reads as an overlay you can act on rather
     than more static page content ---------- */
  .card{width:100%;font-family:inherit;text-align:left;cursor:pointer;
    background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-xl);
    box-shadow:0 22px 40px rgba(0,0,0,.20);padding:var(--sp-20);
    display:flex;flex-direction:column;gap:var(--sp-16);
    transition:box-shadow .15s,transform .12s;}
  .card:hover{box-shadow:0 26px 48px rgba(0,0,0,.24);}
  .card:active{transform:scale(.98);}
  .card:disabled{cursor:default;}
  /* the one unambiguous "tap here to act" cue, standing in for the CTA
     button this card replaces — stacked in flow after the route, not
     floated over it */
  .card-go-row{display:flex;justify-content:flex-end;}
  .card-go{width:32px;height:32px;border-radius:50%;background:var(--bg-button);color:var(--text-inverse);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .card-go svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;}

  .air-row{display:flex;align-items:center;gap:var(--sp-12);}
  .air-mark{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:var(--fw-bold);flex:none;}
  .air-tx{flex:1;min-width:0;}
  .air-name{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .air-num{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .status-chip{flex:none;background:var(--bg-muted);color:var(--text-body);border-radius:var(--r-round);
    padding:6px 12px;font-size:var(--fs-xs);font-weight:var(--fw-bold);}

  .divider{height:1px;background:var(--border-default);border:none;margin:0;}

  .route-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-8);}
  .rp{display:flex;flex-direction:column;gap:2px;}
  .rp.dest{align-items:flex-end;text-align:right;}
  .rp-time{font-family:var(--font-display);font-size:var(--fs-h4);font-weight:var(--fw-display);color:var(--text-primary);}
  .rp-code{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .rp-city{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .route-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;}
  .route-line{position:relative;width:100%;height:1px;background:var(--border-default);}
  .route-line svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;
    stroke:var(--icon-secondary);fill:var(--bg-surface);stroke-width:1.6;}
  .route-dur{font-size:var(--fs-xs);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .meta-row{display:flex;align-items:center;justify-content:space-between;}
  .meta-label{font-size:var(--fs-l);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .meta-value{font-size:var(--fs-l);color:var(--text-primary);font-weight:var(--fw-bold);}

  .fn-wrap{position:relative;z-index:6;}
  .dt-wrap{position:relative;z-index:5;}
  .match-wrap{display:none;flex-direction:column;gap:var(--sp-16);
    position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:5;}
  .match-wrap.show{display:flex;}

  /* ---------- flight-number suggestions — same fused-dropdown treatment,
     but a list of candidates rather than one confirmed flight ---------- */
  .suggest-wrap{display:none;position:absolute;left:0;right:0;top:100%;z-index:6;}
  .suggest-wrap.show{display:block;}
  .suggest-list{background:var(--bg-surface);margin-top:-1.5px;
    border:1.5px solid var(--accent-brand-primary);border-top-color:transparent;
    border-radius:0 0 var(--r-xl) var(--r-xl);box-shadow:0 20px 36px rgba(0,0,0,.16);
    overflow:hidden;}
  .suggest-row{display:flex;align-items:center;gap:var(--sp-12);width:100%;
    border:none;border-top:1px solid var(--border-default);background:none;
    padding:var(--sp-12) var(--sp-16);cursor:pointer;text-align:left;font-family:inherit;}
  .suggest-row:first-child{border-top:none;}
  .suggest-row:hover{background:var(--green-soft);}
  .sg-mark{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:var(--fw-bold);flex:none;}
  .sg-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .sg-num{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .sg-route{font-size:var(--fs-xs);color:var(--text-secondary);font-weight:var(--fw-medium);}
  /* ---------- date calendar — the dt-wrap's other dropdown, shown instead of
     the confirm card while a date hasn't been picked yet; floats the same
     way the confirm card does, for the same reason ---------- */
  .cal-wrap{display:none;position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:5;}
  .cal-wrap.show{display:block;}
  .cal{background:var(--bg-surface);
    border:1px solid var(--border-default);border-radius:var(--r-xl);
    box-shadow:0 22px 40px rgba(0,0,0,.20);
    padding:var(--sp-12) var(--sp-16) var(--sp-16);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;}
  .cal-month{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .cal-nav{width:28px;height:28px;border-radius:50%;border:none;background:none;cursor:default;
    display:flex;align-items:center;justify-content:center;color:var(--icon-secondary);opacity:.35;flex:none;}
  .cal-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:10px;font-weight:var(--fw-bold);color:var(--text-secondary);text-transform:uppercase;
    letter-spacing:.03em;margin-bottom:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;}
  .cal-day{aspect-ratio:1;width:100%;border:none;background:none;border-radius:50%;
    font-family:inherit;font-size:var(--fs-s);font-weight:var(--fw-bold);color:var(--text-primary);
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cal-day:hover{background:var(--green-soft);}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent-brand-primary);}
  .cal-day.selected{background:var(--accent-brand-primary);color:var(--text-inverse);}

  .src-badge{display:none;align-items:center;gap:var(--sp-8);align-self:flex-start;
    background:var(--green-soft);color:var(--green-deep);border-radius:var(--r-round);
    padding:6px 12px;font-size:var(--fs-xs);font-weight:var(--fw-bold);}
  .src-badge svg{width:13px;height:13px;stroke:var(--green-deep);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .upload-only{display:none;}

  /* ---------- prototype stage nav — review aid, not part of the product UI ---------- */
  .stage-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;gap:6px;background:rgba(17,24,39,.92);backdrop-filter:blur(6px);
    padding:8px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:calc(100vw - 32px);overflow-x:auto;z-index:9999;}
  .stage-nav::-webkit-scrollbar{display:none;}
  .stage-nav a{flex:none;padding:7px 12px;border-radius:999px;font-family:-apple-system,sans-serif;
    font-size:12px;font-weight:600;color:rgba(255,255,255,.6);text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s;}
  .stage-nav a:hover{color:#fff;background:rgba(255,255,255,.08);}
  .stage-nav a.current{background:#fff;color:#111827;}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>

    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">&#9679;&#9679;&#9679; &nbsp;&#128246;&nbsp; &#128267;</span>
    </div>

    <div class="appbar">
      <button class="ab-btn" aria-label="Back" onclick="location.href='flight-tracker-myflights.html'">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="at-title">Add flight</span>
      <span style="width:38px"></span>
    </div>

    <div class="body">
      <div class="field-stack">
        <div class="fn-wrap">
          <div class="field">
            <svg viewBox="0 0 24 24"><path d="M2 16l20-8-8 20-3-9-9-3z"/></svg>
            <div class="field-tx">
              <em>Flight number</em>
              <input type="text" id="flightNumInput" value="" placeholder="e.g. AI 101" aria-label="Flight number" oninput="onNumberInput()">
            </div>
          </div>

          <div class="suggest-wrap" id="suggestWrap">
            <div class="suggest-list" id="suggestList"></div>
          </div>
        </div>

        <div class="dt-wrap" id="dateWrap">
          <div class="field" id="dateField" onclick="openCalendar()" role="button" aria-label="Choose date">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <div class="field-tx">
              <em>Date</em>
              <input type="text" id="dateInput" value="Today &middot; 24 Aug" readonly aria-label="Date" tabindex="-1">
            </div>
            <svg class="field-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>

          <div class="cal-wrap" id="calWrap">
            <div class="cal">
              <div class="cal-head">
                <button type="button" class="cal-nav" aria-label="Previous month" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span class="cal-month">August 2026</span>
                <button type="button" class="cal-nav" aria-label="Next month" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
              </div>
              <div class="cal-dow">
                <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
              </div>
              <div class="cal-grid" id="calGrid"></div>
            </div>
          </div>

          <div class="match-wrap" id="matchWrap">
            <div class="src-badge" id="srcBadge">
              <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
              Detected from your boarding pass
            </div>

            <button class="card" id="trackBtn" onclick="trackFlight()">
              <div class="air-row">
                <div class="air-mark" id="airMark">AI</div>
                <div class="air-tx">
                  <div class="air-name" id="airName">Air India</div>
                  <div class="air-num" id="airNum">AI 101 &middot; Mon, 24 Aug</div>
                </div>
                <div class="status-chip" id="statusChip">Scheduled</div>
              </div>

              <hr class="divider">

              <div class="route-row">
                <div class="rp">
                  <div class="rp-time" id="fromTime">14:30</div>
                  <div class="rp-code" id="fromCode">DEL</div>
                  <div class="rp-city" id="fromCity">Delhi</div>
                </div>
                <div class="route-mid">
                  <div class="route-dur" id="routeDur">2h 15m</div>
                  <div class="route-line">
                    <svg viewBox="0 0 24 24"><path d="M2 16l20-8-8 20-3-9-9-3z"/></svg>
                  </div>
                </div>
                <div class="rp dest">
                  <div class="rp-time" id="toTime">16:45</div>
                  <div class="rp-code" id="toCode">BOM</div>
                  <div class="rp-city" id="toCity">Mumbai</div>
                </div>
              </div>

              <hr class="divider upload-only" id="metaDivider">

              <div class="meta-row upload-only" id="rowSeat">
                <span class="meta-label">Seat</span>
                <span class="meta-value">14A</span>
              </div>
              <div class="meta-row upload-only" id="rowPnr">
                <span class="meta-label">Booking reference</span>
                <span class="meta-value">XKQ9TP</span>
              </div>

              <div class="card-go-row">
                <span class="card-go" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="cta-upload" id="uploadBtn" onclick="document.getElementById('ticketFile').click()">
          <svg viewBox="0 0 24 24"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Upload ticket
        </button>
        <input type="file" id="ticketFile" accept="image/*,.pdf" style="display:none" onchange="handleTicket()">
      </div>
    </div>
  </div>
</div>

<script>
/* A handful of known mock flights, including two Air India numbers, so typing
   "AI" actually has something to disambiguate. Anything typed that matches
   none of these just shows no suggestions — there's no fallback shape here,
   since a picked-from-a-list flow has nothing sensible to fall back to. */
var MOCK_FLIGHTS = {
  AI101:{airline:'Air India',
    from:{code:'GOI',city:'Goa',time:'14:30'},
    to:{code:'BOM',city:'Mumbai',time:'16:45'},
    duration:'2h 15m'},
  AI202:{airline:'Air India',
    from:{code:'BOM',city:'Mumbai',time:'08:10'},
    to:{code:'BLR',city:'Bengaluru',time:'09:50'},
    duration:'1h 40m'},
  '6E234':{airline:'IndiGo',
    from:{code:'DEL',city:'Delhi',time:'19:15'},
    to:{code:'BOM',city:'Mumbai',time:'21:25'},
    duration:'2h 10m'},
  UK955:{airline:'Vistara',
    from:{code:'BLR',city:'Bengaluru',time:'18:05'},
    to:{code:'DEL',city:'Delhi',time:'20:55'},
    duration:'2h 50m'}
};
var CARRIERS = {AI:'Air India', '6E':'IndiGo', UK:'Vistara', SG:'SpiceJet', G8:'Go First', QP:'Akasa Air'};
var compact, currentFlightNum, pendingNum;

/* This app's fictional August: the 1st lands on a Saturday, which is what
   puts "today" on the 24th on a Monday — matching the date every other mock
   flight screen already assumes. Not real-world August 2026, deliberately. */
var FIRST_DOW = 6;
var DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var TODAY_DAY = 24;
var selectedDay = TODAY_DAY;

function dowName(day){
  return DOW_NAMES[(FIRST_DOW + (day - 1)) % 7];
}

function findKnownMatches(raw){
  var input = raw.replace(/\s+/g,'').toUpperCase();
  if(input.length < 2) return [];
  return Object.keys(MOCK_FLIGHTS).filter(function(key){
    return key.indexOf(input) === 0;
  });
}

function displayNum(key){
  var code = key.slice(0,2), digits = key.slice(2);
  return digits ? (code + ' ' + digits) : code;
}

/* Number → pick from suggestions → date → confirm, each step unlocking the
   next. Editing the flight number at any point re-locks everything after it,
   since a new number means the date and confirm steps no longer apply. */
function closeDownstream(){
  pendingNum = null;
  document.getElementById('dateWrap').classList.remove('show');
  document.getElementById('calWrap').classList.remove('show');
  document.getElementById('matchWrap').classList.remove('show');
}

function onNumberInput(){
  closeDownstream();
  var matches = findKnownMatches(document.getElementById('flightNumInput').value);
  var wrap = document.getElementById('suggestWrap');
  if(!matches.length){
    wrap.classList.remove('show');
    document.getElementById('suggestList').innerHTML = '';
    return;
  }
  document.getElementById('suggestList').innerHTML = matches.map(function(key){
    var f = MOCK_FLIGHTS[key];
    var code = key.slice(0,2);
    return '<button type="button" class="suggest-row" onclick="selectNumber(\'' + key + '\')">' +
        '<span class="sg-mark">' + code + '</span>' +
        '<span class="sg-tx">' +
          '<span class="sg-num">' + displayNum(key) + ' &middot; ' + f.airline + '</span>' +
          '<span class="sg-route">' + f.from.code + ' &rarr; ' + f.to.code + '</span>' +
        '</span>' +
      '</button>';
  }).join('');
  wrap.classList.add('show');
}

function selectNumber(key){
  document.getElementById('flightNumInput').value = displayNum(key);
  document.getElementById('suggestWrap').classList.remove('show');
  pendingNum = key;
  document.getElementById('dateWrap').classList.add('show');
}

function renderCalendar(){
  var cells = [];
  for(var i = 0; i < FIRST_DOW; i++) cells.push(null);
  for(var d = 1; d <= 31; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  document.getElementById('calGrid').innerHTML = cells.map(function(d){
    if(!d) return '<span></span>';
    var cls = 'cal-day';
    if(d === TODAY_DAY) cls += ' today';
    if(d === selectedDay) cls += ' selected';
    return '<button type="button" class="' + cls + '" onclick="pickDate(' + d + ')">' + d + '</button>';
  }).join('');
}

function openCalendar(){
  if(!pendingNum) return;
  document.getElementById('matchWrap').classList.remove('show');
  renderCalendar();
  document.getElementById('calWrap').classList.add('show');
}

function pickDate(day){
  selectedDay = day;
  document.getElementById('dateInput').value =
    (day === TODAY_DAY ? 'Today' : dowName(day)) + ' · ' + day + ' Aug';
  document.getElementById('calWrap').classList.remove('show');
  renderMatch(pendingNum, false);
}

function renderMatch(num, fromUpload){
  compact = num.replace(/\s+/g,'').toUpperCase();
  var code = compact.slice(0,2);
  var digits = compact.slice(2);
  currentFlightNum = digits ? (code + ' ' + digits) : code;
  var flight = MOCK_FLIGHTS[compact] || MOCK_FLIGHTS.AI101;
  document.getElementById('suggestWrap').classList.remove('show');
  document.getElementById('calWrap').classList.remove('show');
  document.getElementById('dateWrap').classList.add('show');
  document.getElementById('matchWrap').classList.add('show');

  document.getElementById('airMark').textContent = code;
  document.getElementById('airNum').textContent = currentFlightNum + ' · ' + dowName(selectedDay) + ', ' + selectedDay + ' Aug';
  document.getElementById('airName').textContent = CARRIERS[code] || 'Tracked flight';
  document.getElementById('fromTime').textContent = flight.from.time;
  document.getElementById('fromCode').textContent = flight.from.code;
  document.getElementById('fromCity').textContent = flight.from.city;
  document.getElementById('toTime').textContent = flight.to.time;
  document.getElementById('toCode').textContent = flight.to.code;
  document.getElementById('toCity').textContent = flight.to.city;
  document.getElementById('routeDur').textContent = flight.duration;

  var showUpload = !!fromUpload;
  document.getElementById('srcBadge').style.display = showUpload ? 'flex' : 'none';
  document.getElementById('metaDivider').style.display = showUpload ? 'block' : 'none';
  document.getElementById('rowSeat').style.display = showUpload ? 'flex' : 'none';
  document.getElementById('rowPnr').style.display = showUpload ? 'flex' : 'none';

  document.getElementById('trackBtn').disabled = false;
  document.getElementById('statusChip').textContent = 'Scheduled';
}
function handleTicket(){
  var input = document.getElementById('ticketFile');
  if(!input.files || !input.files.length) return;
  var btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spin"></span> Reading your ticket&hellip;';
  setTimeout(function(){
    /* the ticket already carries its date, so there's nothing to tap through —
       jump straight to the confirm card */
    renderMatch('AI101', true);
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg> Upload ticket';
    input.value = '';
  }, 900);
}

function trackFlight(){
  document.getElementById('trackBtn').disabled = true;
  document.getElementById('statusChip').textContent = '✓ Tracking';
  setTimeout(function(){
    location.href = 'flight-tracker-detail.html?num=' + encodeURIComponent(compact);
  }, 500);
}
</script>
<script>
(function(){
  var STAGES = [
    {file:'flight-tracker-myflights.html', label:'My flights'},
    {file:'flight-tracker.html', label:'Add flight'},
    {file:'flight-tracker-detail.html', label:'Pre-flight'},
    {file:'flight-tracker-airport.html', label:'Boarding pass'},
    {file:'flight-tracker-inflight.html', label:'Boarded', extra:'phase=boarded'},
    {file:'flight-tracker-inflight.html', label:'In the air'},
    {file:'flight-tracker-arrival.html', label:'Landed'}
  ];
  var here = location.pathname.split('/').pop();
  var herePhase = new URLSearchParams(location.search).get('phase') || '';
  var nav = document.createElement('div');
  nav.className = 'stage-nav';
  STAGES.forEach(function(s){
    var params = [];
    if(s.file !== 'flight-tracker.html' && s.file !== 'flight-tracker-myflights.html' && typeof compact !== 'undefined') params.push('num=' + encodeURIComponent(compact));
    if(s.extra) params.push(s.extra);
    var a = document.createElement('a');
    a.href = s.file + (params.length ? '?' + params.join('&') : '');
    a.textContent = s.label;
    var matchesPhase = s.extra ? herePhase === 'boarded' : herePhase !== 'boarded';
    if(s.file === here && matchesPhase) a.classList.add('current');
    nav.appendChild(a);
  });
  document.body.appendChild(nav);
})();
</script>
</body>
</html>
