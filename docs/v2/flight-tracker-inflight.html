<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onto — In the air</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-default);color:var(--text-primary);
    font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }

  /* ---------- phone frame ---------- */
  .phone{position:relative;width:390px;height:844px;background:#000;border-radius:54px;
    padding:12px;box-shadow:0 40px 90px rgba(30,22,10,.16),0 0 0 2px rgba(0,0,0,.15);flex:none;}
  .screen{position:relative;width:100%;height:100%;background:var(--bg-surface);border-radius:42px;
    overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:30px;
    background:#000;border-radius:20px;z-index:40;}

  .statusbar{position:relative;z-index:35;flex:none;display:flex;align-items:center;
    justify-content:space-between;padding:20px 26px 6px;font-size:14px;font-weight:600;
    color:var(--text-primary);}
  .sb-right{display:flex;align-items:center;gap:6px;font-size:13px;}

  .appbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px;}
  .ab-btn{width:38px;height:38px;border-radius:50%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--icon-primary);
    transition:background .15s;flex:none;}
  .ab-btn:hover{background:var(--green-soft);}
  .ab-btn svg{width:20px;height:20px;stroke:var(--icon-primary);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .at-title{font-family:var(--font-body);font-size:var(--fs-xl);font-weight:var(--fw-bold);color:var(--text-primary);}

  .body{flex:1;overflow-y:auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:var(--sp-20);}

  /* ---------- status banner ---------- */
  .status-banner{background:var(--green-soft);border-radius:var(--r-xl);padding:var(--sp-16) var(--sp-20);
    display:flex;flex-direction:column;gap:2px;}
  .status-banner .headline{font-size:var(--fs-xxxl);font-weight:var(--fw-bold);color:var(--green-deep);}
  .status-banner .cause{display:flex;align-items:center;gap:4px;font-size:var(--fs-s);
    font-weight:var(--fw-medium);color:var(--green-deep);opacity:.82;cursor:pointer;}
  .status-banner .cause svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ---------- progress card (schematic — no real map tiles in this prototype) ---------- */
  .progress-card{border:1px solid var(--border-default);border-radius:var(--r-xl);
    box-shadow:var(--shadow-l2);padding:var(--sp-20);display:flex;flex-direction:column;gap:var(--sp-16);}
  .progress-air{display:flex;align-items:center;gap:var(--sp-12);}
  .air-mark{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:var(--fw-bold);flex:none;}
  .air-tx{flex:1;min-width:0;}
  .air-name{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .air-num{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .path-wrap{position:relative;}
  .path-svg{width:100%;height:52px;display:block;overflow:visible;}
  .path-plane{transition:none;}
  .path-endpoints{display:flex;align-items:flex-start;justify-content:space-between;margin-top:2px;}
  .path-pt{display:flex;flex-direction:column;gap:1px;}
  .path-pt.dest{align-items:flex-end;text-align:right;}
  .path-code{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}
  .path-time{font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .path-caption{text-align:center;font-size:var(--fs-s);color:var(--text-secondary);font-weight:var(--fw-medium);}

  .divider{height:1px;background:var(--border-default);border:none;margin:0;}

  /* ---------- flight stats ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);}
  .stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .stat .lbl{font-size:var(--fs-xs);color:var(--text-secondary);font-weight:var(--fw-bold);
    text-transform:uppercase;letter-spacing:.03em;}
  .stat .val{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}

  /* ---------- destination info ---------- */
  .dest-info{display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--border-default);border-radius:var(--r-lg);padding:var(--sp-12) var(--sp-16);}
  .dest-info-tx{display:flex;flex-direction:column;gap:1px;}
  .dest-info-label{font-size:var(--fs-xs);color:var(--text-secondary);font-weight:var(--fw-medium);}
  .dest-info-val{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-primary);}

  /* ---------- prototype stage nav — review aid, not part of the product UI ---------- */
  .stage-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;gap:6px;background:rgba(17,24,39,.92);backdrop-filter:blur(6px);
    padding:8px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:calc(100vw - 32px);overflow-x:auto;z-index:9999;}
  .stage-nav::-webkit-scrollbar{display:none;}
  .stage-nav a{flex:none;padding:7px 12px;border-radius:999px;font-family:-apple-system,sans-serif;
    font-size:12px;font-weight:600;color:rgba(255,255,255,.6);text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s;}
  .stage-nav a:hover{color:#fff;background:rgba(255,255,255,.08);}
  .stage-nav a.current{background:#fff;color:#111827;}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>

    <div class="statusbar">
      <span>15:53</span>
      <span class="sb-right">&#9679;&#9679;&#9679; &nbsp;&#9992;&#65039;&nbsp; &#128267;</span>
    </div>

    <div class="appbar">
      <button class="ab-btn" aria-label="Back" onclick="location.href='flight-tracker-airport.html?num=' + encodeURIComponent(compact)">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="at-title" id="pageTitle">AI 101</span>
      <button class="ab-btn" aria-label="More options" onclick="stopTracking()">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>

    <div class="body">
      <div class="status-banner">
        <div class="headline" id="bannerHeadline">In the air &middot; Landing in 52m</div>
        <div class="cause">
          <span id="bannerCauseText">Cruising at 38,000 ft</span>
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-air">
          <div class="air-mark" id="airMark">AI</div>
          <div class="air-tx">
            <div class="air-name" id="airName">Air India</div>
            <div class="air-num" id="airNum">AI 101</div>
          </div>
        </div>

        <div class="path-wrap">
          <svg class="path-svg" viewBox="0 0 320 52" preserveAspectRatio="none">
            <line x1="20" y1="26" x2="300" y2="26" stroke="var(--border-default)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
            <line id="pathDone" x1="20" y1="26" x2="20" y2="26" stroke="var(--accent-brand-primary)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="26" r="4" fill="var(--accent-brand-primary)"/>
            <circle cx="300" cy="26" r="4" fill="none" stroke="var(--icon-secondary)" stroke-width="2"/>
            <g id="planeMark" transform="translate(20,26)">
              <path d="M7 0l-14-5.6v11.2z" fill="var(--text-primary)"/>
            </g>
          </svg>
          <div class="path-caption" id="progressCaption">62% of the way there</div>
        </div>

        <div class="path-endpoints">
          <div class="path-pt">
            <div class="path-code" id="fromCode">DEL</div>
            <div class="path-time" id="fromTime">Departed 14:30</div>
          </div>
          <div class="path-pt dest">
            <div class="path-code" id="toCode">BOM</div>
            <div class="path-time" id="etaTime">Lands 16:35</div>
          </div>
        </div>

        <hr class="divider">

        <div class="stat-row">
          <div class="stat"><span class="lbl">Altitude</span><span class="val" id="altVal">38,000 ft</span></div>
          <div class="stat"><span class="lbl">Speed</span><span class="val" id="spdVal">870 km/h</span></div>
          <div class="stat"><span class="lbl">Remaining</span><span class="val" id="remVal">52m</span></div>
        </div>
      </div>

      <div class="dest-info">
        <div class="dest-info-tx">
          <div class="dest-info-label">Landing at</div>
          <div class="dest-info-val" id="destCity">Mumbai</div>
        </div>
        <div class="dest-info-tx" style="align-items:flex-end;text-align:right;">
          <div class="dest-info-label">Local weather &middot; Belt</div>
          <div class="dest-info-val" id="destWxBelt">29&deg; &middot; Belt 4</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* One screen covers both "boarded, about to depart" and "in the air" — they
   differ only in banner copy, plane position, and whether altitude/speed mean
   anything yet. No separate "boarded" page needed. */
var MOCK_FLIGHTS = {
  AI101:{airline:'Air India',
    from:{code:'DEL',time:'14:30'}, to:{code:'BOM',eta:'16:35',city:'Mumbai',weather:'29°',belt:'4'},
    altitude:'38,000 ft',speed:'870 km/h',progress:.62,remaining:'52m',
    boarded:{remaining:'12m'}},
  '6E234':{airline:'IndiGo',
    from:{code:'DEL',time:'19:15'}, to:{code:'BOM',eta:'21:25',city:'Mumbai',weather:'28°',belt:'2'},
    altitude:'36,000 ft',speed:'845 km/h',progress:.35,remaining:'1h 26m',
    boarded:{remaining:'10m'}},
  UK955:{airline:'Vistara',
    from:{code:'BLR',time:'18:05'}, to:{code:'DEL',eta:'20:55',city:'Delhi',weather:'33°',belt:'6'},
    altitude:'37,000 ft',speed:'860 km/h',progress:.5,remaining:'1h 25m',
    boarded:{remaining:'8m'}}
};
var CARRIERS = {AI:'Air India', '6E':'IndiGo', UK:'Vistara', SG:'SpiceJet', G8:'Go First', QP:'Akasa Air'};

var compact = (new URLSearchParams(location.search).get('num') || 'AI101').replace(/\s+/g,'').toUpperCase();
var code = compact.slice(0,2);
var num = compact.slice(2);
var currentFlightNum = num ? (code + ' ' + num) : code;
var flight = MOCK_FLIGHTS[compact] || MOCK_FLIGHTS.AI101;
var isBoarded = new URLSearchParams(location.search).get('phase') === 'boarded';

document.getElementById('airMark').textContent = code;
document.getElementById('airNum').textContent = currentFlightNum;
document.getElementById('airName').textContent = CARRIERS[code] || 'Tracked flight';
document.getElementById('pageTitle').textContent = currentFlightNum;
document.title = 'onto — ' + currentFlightNum + (isBoarded ? ' boarded' : ' in the air');

document.getElementById('fromCode').textContent = flight.from.code;
document.getElementById('toCode').textContent = flight.to.code;
document.getElementById('etaTime').textContent = 'Lands ' + flight.to.eta;

if(isBoarded){
  document.getElementById('bannerHeadline').textContent = 'Boarding complete · Departs in ' + flight.boarded.remaining;
  document.getElementById('bannerCauseText').textContent = 'Doors closed';
  document.getElementById('fromTime').textContent = 'Departs ' + flight.from.time;
  document.getElementById('progressCaption').textContent = 'On the ground · ready for departure';
  document.getElementById('altVal').textContent = 'Ground';
  document.getElementById('spdVal').textContent = '—';
  document.getElementById('remVal').textContent = flight.boarded.remaining;

  var x0 = 20;
  document.getElementById('pathDone').setAttribute('x2', x0);
  document.getElementById('planeMark').setAttribute('transform', 'translate(' + x0 + ',26)');
} else {
  document.getElementById('bannerHeadline').textContent = 'In the air · Landing in ' + flight.remaining;
  document.getElementById('bannerCauseText').textContent = 'Cruising at ' + flight.altitude;
  document.getElementById('fromTime').textContent = 'Departed ' + flight.from.time;
  document.getElementById('progressCaption').textContent = Math.round(flight.progress * 100) + '% of the way there';
  document.getElementById('altVal').textContent = flight.altitude;
  document.getElementById('spdVal').textContent = flight.speed;
  document.getElementById('remVal').textContent = flight.remaining;

  var x = 20 + 280 * flight.progress;
  document.getElementById('pathDone').setAttribute('x2', x);
  document.getElementById('planeMark').setAttribute('transform', 'translate(' + x + ',26)');
}

document.getElementById('destCity').textContent = flight.to.city;
document.getElementById('destWxBelt').textContent = flight.to.weather + ' · Belt ' + flight.to.belt;

function stopTracking(){
  if(confirm('Stop tracking ' + currentFlightNum + '?')){
    location.href = 'flight-tracker.html';
  }
}
</script>
<script>
(function(){
  var STAGES = [
    {file:'flight-tracker.html', label:'Add flight'},
    {file:'flight-tracker-confirm.html', label:'Confirm'},
    {file:'flight-tracker-detail.html', label:'Pre-flight'},
    {file:'flight-tracker-airport.html', label:'Boarding pass'},
    {file:'flight-tracker-inflight.html', label:'Boarded', extra:'phase=boarded'},
    {file:'flight-tracker-inflight.html', label:'In the air'},
    {file:'flight-tracker-arrival.html', label:'Landed'}
  ];
  var here = location.pathname.split('/').pop();
  var herePhase = new URLSearchParams(location.search).get('phase') || '';
  var nav = document.createElement('div');
  nav.className = 'stage-nav';
  STAGES.forEach(function(s){
    var params = [];
    if(s.file !== 'flight-tracker.html' && typeof compact !== 'undefined') params.push('num=' + encodeURIComponent(compact));
    if(s.extra) params.push(s.extra);
    var a = document.createElement('a');
    a.href = s.file + (params.length ? '?' + params.join('&') : '');
    a.textContent = s.label;
    var matchesPhase = s.extra ? herePhase === 'boarded' : herePhase !== 'boarded';
    if(s.file === here && matchesPhase) a.classList.add('current');
    nav.appendChild(a);
  });
  document.body.appendChild(nav);
})();
</script>
</body>
</html>
