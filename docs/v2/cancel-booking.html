<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Exotica · Cancel booking</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  h1{font-family:var(--font-display);letter-spacing:-.01em;margin:0;}

  .card{width:540px;max-width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;}
  .head{text-align:center;padding:38px 34px 22px;}
  .warn{width:64px;height:64px;border-radius:50%;background:#fafaf9;border:1px solid #f2d5d0;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .warn svg{width:30px;height:30px;stroke:var(--danger);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .head h1{font-size:26px;margin-bottom:8px;}
  .head p{color:var(--muted);font-size:15px;margin:0 auto;max-width:380px;}

  .stars{color:var(--gold);letter-spacing:3px;font-size:14px;}
  .sum{margin:4px 34px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .sum-hd{padding:18px 18px 16px;background:#fafaf9;}
  .sum-hd .h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .sum-hd .n{font-family:var(--font-display);font-size:17px;font-weight:700;margin-top:3px;}
  .sum-hd .hd-dates{font-size:14.5px;font-weight:600;color:#2c2c2c;margin-top:11px;}
  .sum-hd .hd-dates span{font-weight:400;color:var(--muted);}
  .sum-hd .hd-dates span::before{content:" · ";}
  .sum-hd .hd-ref{font-size:12.5px;color:var(--muted);margin-top:9px;}
  .sum-hd .hd-ref b{color:#2c2c2c;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums;}
  .sum-hd .hd-paid{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600;}
  .sum-hd .hd-paid b{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}

  /* refund box */
  .refund{margin:18px 34px 0;padding:16px 18px;border:1px solid #cfe8db;background:#fafaf9;border-radius:14px;}
  .refund .rtop{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .refund .rl{font-size:13px;color:#3a6a55;font-weight:600;}
  .refund .rl b{display:block;color:var(--green);font-size:11.5px;letter-spacing:.04em;margin-top:2px;font-weight:700;}
  .refund .ramt{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:-.01em;color:var(--ink);}

  .cta{display:flex;gap:12px;padding:24px 34px 30px;}
  .btn{flex:1;border:none;background:var(--jade);color:#fff;font-size:15.5px;font-weight:600;
    padding:15px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;
    transition:background .15s;}
  .btn:hover{background:var(--jade-deep);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:var(--danger-deep);}
  .btn.ghost{background:#fff;color:var(--jade);border:1px solid #e3e3df;}
  .btn.ghost:hover{background:#fafaf9;border-color:#808080;}
  .fine{text-align:center;color:var(--muted);font-size:12.5px;padding:0 40px 30px;margin:0;}
  @media(max-width:480px){ .cta{flex-direction:column-reverse;} }

  [hidden]{display:none !important;}
</style>
</head>
<body>
  <!-- ===== cancel confirmation ===== -->
  <div class="card" id="cancelCard">
    <div class="head">
      <div class="warn" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4"/><path d="M12 17.2v.01"/></svg>
      </div>
      <h1>Cancel this booking?</h1>
    </div>

    <div class="sum">
      <div class="sum-hd">
        <div class="h">Your stay</div>
        <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
        <div class="n" id="hotel">Taj Exotica Resort &amp; Spa</div>
        <div class="hd-dates" id="dates">Fri 10 – Mon 13 Jul<span id="nights">3 nights</span></div>
        <div class="hd-ref">Booking reference&nbsp; <b id="ref">TAJ-000000</b></div>
        <div class="hd-paid">Amount paid <b id="paidAmt">₹55,500</b></div>
      </div>
    </div>

    <div class="refund">
      <div class="rtop">
        <div class="rl">Refund to original payment method</div>
        <div class="ramt" id="refundAmt">₹55,500</div>
      </div>
    </div>

    <div class="cta">
      <a class="btn ghost" href="booking-details.html">Keep booking</a>
      <button type="button" class="btn danger" id="confirmCancel">Cancel booking</button>
    </div>
  </div>

<script>
  var b = {};
  try { b = JSON.parse(sessionStorage.getItem('booking')) || {}; } catch(e){}
  function set(id, val){ if(val){ document.getElementById(id).textContent = val; } }

  set('hotel', b.hotel);
  set('paidAmt', b.amount);
  set('refundAmt', b.refund || b.amount);
  set('ref', b.ref || 'TAJ-000000');
  if(b.dates){ document.getElementById('dates').innerHTML = b.dates + (b.nights ? '<span>'+b.nights+'</span>' : ''); }

  document.getElementById('confirmCancel').addEventListener('click', function(){
    b.status = 'cancelled';
    b.refund = b.amount || '';
    b.refundType = 'full';
    try { sessionStorage.setItem('booking', JSON.stringify(b)); } catch(e){}
    window.location.href = 'cancelled.html';
  });
</script>
</body>
</html>
